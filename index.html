<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Neon Shuffle — 8 games, 1 life</title>
<meta name="description" content="Neon Shuffle — 8 arcade games in one run. The game keeps switching on you without warning. Lose anywhere, lose everything.">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #0a0a14;
    overflow: hidden;
    touch-action: none;
    font-family: "Courier New", monospace;
  }
  #wrap {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    background: #0a0a14;
    box-shadow: 0 0 60px rgba(0, 229, 255, 0.12);
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<script>
"use strict";

// ---------- Setup ----------
const W = 480, H = 640;
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = W;
canvas.height = H;

function fitCanvas() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = Math.floor(W * s) + "px";
  canvas.style.height = Math.floor(H * s) + "px";
}
window.addEventListener("resize", fitCanvas);
fitCanvas();

// ---------- Audio (tiny WebAudio synth) ----------
let audioCtx = null, muted = false;
function beep(freq, dur = 0.06, type = "square", vol = 0.08, slide = 0) {
  if (muted) return;
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { muted = true; return; }
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(audioCtx.destination);
  o.start(t);
  o.stop(t + dur);
}
const sfx = {
  paddle: () => beep(220, 0.05, "square", 0.07),
  wall:   () => beep(160, 0.04, "square", 0.05),
  brick:  (combo) => beep(330 + Math.min(combo, 12) * 40, 0.06, "square", 0.08),
  steel:  () => beep(110, 0.05, "sawtooth", 0.06),
  boom:   () => beep(90, 0.3, "sawtooth", 0.14, -40),
  laser:  () => beep(880, 0.07, "square", 0.04, -500),
  shoot:  () => beep(820, 0.05, "square", 0.03, -400),
  power:  () => beep(440, 0.09, "sine", 0.1, 440),
  bad:    () => beep(140, 0.2, "sawtooth", 0.09, -60),
  flap:   () => beep(480, 0.06, "sine", 0.07, -160),
  jump:   () => beep(380, 0.08, "sine", 0.07, 200),
  eat:    () => beep(620, 0.07, "square", 0.08, 220),
  pass:   () => beep(740, 0.06, "sine", 0.06),
  drop:   () => beep(260, 0.07, "square", 0.08, -80),
  perfect:() => { beep(660, 0.07, "sine", 0.1); setTimeout(() => beep(990, 0.1, "sine", 0.1), 70); },
  point:  () => { beep(523, 0.08, "sine", 0.09); setTimeout(() => beep(784, 0.1, "sine", 0.09), 80); },
  whoosh: () => beep(180, 0.3, "sine", 0.08, 420),
  level:  () => { beep(523, 0.1, "sine", 0.1); setTimeout(() => beep(659, 0.1, "sine", 0.1), 100); setTimeout(() => beep(784, 0.15, "sine", 0.1), 200); },
  over:   () => { beep(300, 0.2, "sawtooth", 0.1, -150); setTimeout(() => beep(200, 0.4, "sawtooth", 0.1, -120), 180); }
};

// ---------- Shared FX ----------
let particles = [], popups = [], stars = [];
let shake = 0, flash = 0, pulse = 0;
for (let i = 0; i < 70; i++) {
  stars.push({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 1.5 + 0.3, v: Math.random() * 12 + 4 });
}

function burst(x, y, hue, n = 14, speed = 220) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const v = Math.random() * speed + 40;
    particles.push({
      x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
      life: 0, max: Math.random() * 0.5 + 0.25,
      hue, size: Math.random() * 3 + 1.5, g: 1
    });
  }
}
function trail(x, y, hue) {
  particles.push({ x, y, vx: 0, vy: 0, life: 0, max: 0.22, hue, size: 4, g: 0 });
}
function popup(x, y, txt, hue) {
  popups.push({ x, y, txt, hue, life: 0 });
}
function updateFx(dt) {
  for (const s of stars) {
    s.y += s.v * dt;
    if (s.y > H) { s.y = -2; s.x = Math.random() * W; }
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life += dt;
    if (p.life > p.max) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 300 * dt * p.g;
    p.vx *= 0.99;
  }
  for (let i = popups.length - 1; i >= 0; i--) {
    const p = popups[i];
    p.life += dt;
    p.y -= 36 * dt;
    if (p.life > 0.8) popups.splice(i, 1);
  }
  if (shake > 0) shake = Math.max(0, shake - dt * 30);
  if (flash > 0) flash = Math.max(0, flash - dt * 3);
}

function glowRect(x, y, w, h, color, blur = 12) {
  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = blur;
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w, h);
  ctx.restore();
}

// ---------- Difficulty ----------
const DIFFS = {
  easy: {
    key: "easy", label: "EASY", hue: 130,
    speed: 0.85, scoreMult: 1, sw: [8, 14], rapid: 0.10,
    paddleW: 105, drop: 0.18, flapGap: 172, snakeStep: 0.16,
    pongAI: 225, pongErr: 65, stackW: 195, invFire: 0.22
  },
  normal: {
    key: "normal", label: "NORMAL", hue: 55,
    speed: 1, scoreMult: 1.5, sw: [4, 9], rapid: 0.25,
    paddleW: 90, drop: 0.14, flapGap: 150, snakeStep: 0.13,
    pongAI: 290, pongErr: 38, stackW: 160, invFire: 0.5
  },
  hard: {
    key: "hard", label: "HARD", hue: 0,
    speed: 1.3, scoreMult: 2.5, sw: [2.5, 6], rapid: 0.4,
    paddleW: 68, drop: 0.10, flapGap: 122, snakeStep: 0.095,
    pongAI: 360, pongErr: 16, stackW: 118, invFire: 1.0
  }
};
let diff = DIFFS.normal;
let highs = {
  easy: +(localStorage.getItem("ns_high_easy") || 0),
  normal: +(localStorage.getItem("ns_high_normal") || 0),
  hard: +(localStorage.getItem("ns_high_hard") || 0)
};

// ---------- Session ----------
const STATE = { MENU: 0, PLAY: 1, SWITCH: 2, OVER: 3 };
let state = STATE.MENU;
let score = 0;
let switchTimer = 10, switchMax = 10, overlayT = 0, glitchT = 0;
let failedIn = "", overLock = 0;
let switches = 0, runTime = 0;
let paused = false;
let keys = {};
let pointerX = null;

function addScore(n, x, y, hue = 60) {
  const v = Math.round(n * diff.scoreMult);
  score += v;
  if (x !== undefined) popup(x, y, "+" + v, hue);
}

function fail(gameName) {
  failedIn = gameName;
  state = STATE.OVER;
  overLock = 0.8;
  shake = 10;
  flash = 1;
  sfx.over();
  if (score > highs[diff.key]) {
    highs[diff.key] = score;
    localStorage.setItem("ns_high_" + diff.key, score);
  }
}

// =======================================================
// GAME 1: BREAKOUT
// =======================================================
function makeBreakout() {
  const paddle = { x: W / 2, w: 90, h: 12, y: H - 46 };
  let balls = [], bricks = [], powerups = [], lasers = [];
  let level = 1, combo = 0;
  let slowmoT = 0, wideT = 0, fireT = 0, laserT = 0, shrinkT = 0, laserCd = 0;

  const POWER_INFO = {
    multi:  { label: "×3", hue: 50,  good: true },
    wide:   { label: "⟷",  hue: 130, good: true },
    slow:   { label: "◐",  hue: 280, good: true },
    laser:  { label: "⚡", hue: 190, good: true },
    fire:   { label: "◉",  hue: 25,  good: true },
    gem:    { label: "◆",  hue: 340, good: true },
    shrink: { label: "☠",  hue: 0,   good: false }
  };

  function ballSpeed() {
    const sp = (300 + (level - 1) * 22) * diff.speed;
    return slowmoT > 0 ? sp * 0.6 : sp;
  }
  function newBall(stuck = true) {
    return { x: paddle.x, y: paddle.y - 10, vx: 0, vy: 0, stuck };
  }
  function launchBall(b) {
    const a = (-Math.PI / 2) + (Math.random() * 0.8 - 0.4);
    const sp = ballSpeed();
    b.vx = Math.cos(a) * sp;
    b.vy = Math.sin(a) * sp;
    b.stuck = false;
  }
  function buildLevel(n) {
    bricks = [];
    const cols = 10, rows = Math.min(5 + Math.floor(n / 2), 9);
    const bw = 42, bh = 18, gap = 4;
    const ox = (W - cols * (bw + gap) + gap) / 2;
    const oy = 86;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (n % 3 === 2 && (r + c) % 2 === 0 && r > 1) continue;
        if (n % 3 === 0 && c > 1 && c < cols - 2 && r === Math.floor(rows / 2)) continue;
        let type = "normal";
        const roll = Math.random();
        if (roll < 0.08) type = "boom";
        else if (n >= 3 && roll < 0.08 + Math.min(0.04 + n * 0.01, 0.12) && r > 0) type = "steel";
        const tough = type === "normal" && n > 1 && r < 2 && Math.random() < Math.min(0.2 + n * 0.06, 0.7);
        const x = ox + c * (bw + gap);
        bricks.push({
          x, bx: x, y: oy + r * (bh + gap),
          w: bw, h: bh, row: r,
          hp: type === "steel" ? Infinity : (tough ? 2 : 1),
          maxHp: tough ? 2 : 1,
          hue: 180 + r * 28, type
        });
      }
    }
  }
  function clearPowers() {
    slowmoT = 0; wideT = 0; fireT = 0; laserT = 0; shrinkT = 0;
    paddle.w = diff.paddleW;
    powerups = []; lasers = [];
  }
  function pickPower() {
    const pool = [
      ["multi", 17], ["laser", 17], ["fire", 15], ["wide", 13],
      ["slow", 13], ["shrink", 17], ["gem", 8]
    ];
    let r = Math.random() * pool.reduce((s, p) => s + p[1], 0);
    for (const [k, w] of pool) { r -= w; if (r <= 0) return k; }
    return "multi";
  }
  function destroyBrick(br) {
    const i = bricks.indexOf(br);
    if (i === -1) return;
    bricks.splice(i, 1);
    combo++;
    addScore(10 * combo, br.x + br.w / 2, br.y, br.type === "boom" ? 25 : br.hue);
    shake = Math.min(shake + 2.5, 8);
    burst(br.x + br.w / 2, br.y + br.h / 2, br.type === "steel" ? 0 : br.hue, 16);
    sfx.brick(combo);
    if (Math.random() < diff.drop) {
      powerups.push({ x: br.x + br.w / 2, y: br.y + br.h / 2, vy: 120, kind: pickPower() });
    }
    if (br.type === "boom") explode(br);
  }
  function explode(br) {
    const cx = br.x + br.w / 2, cy = br.y + br.h / 2;
    shake = Math.min(shake + 6, 12);
    burst(cx, cy, 25, 30, 320);
    burst(cx, cy, 50, 16, 180);
    sfx.boom();
    const hit = bricks.filter(o => {
      const dx = (o.x + o.w / 2) - cx, dy = (o.y + o.h / 2) - cy;
      return Math.hypot(dx, dy) < 78;
    });
    for (const o of hit) destroyBrick(o);
  }
  function damageBrick(br, instant) {
    if (br.type === "steel" && !instant) {
      burst(br.x + br.w / 2, br.y + br.h / 2, 0, 4, 90);
      sfx.steel();
      return;
    }
    if (instant || br.hp <= 1) {
      destroyBrick(br);
    } else {
      br.hp--;
      addScore(5);
      shake = Math.min(shake + 1, 5);
      burst(br.x + br.w / 2, br.y + br.h / 2, br.hue, 6, 120);
      sfx.brick(0);
    }
  }
  function applyPower(kind, x, y) {
    const info = POWER_INFO[kind];
    if (kind === "multi") {
      const extra = [];
      for (const b of balls) {
        if (b.stuck) continue;
        for (const da of [-0.5, 0.5]) {
          const sp = Math.hypot(b.vx, b.vy);
          const a = Math.atan2(b.vy, b.vx) + da;
          extra.push({ x: b.x, y: b.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, stuck: false });
        }
        break;
      }
      if (extra.length === 0 && balls[0]) launchBall(balls[0]);
      balls.push(...extra);
      popup(x, y, "MULTIBALL", info.hue);
    } else if (kind === "wide") {
      wideT = 10; shrinkT = 0;
      popup(x, y, "WIDE", info.hue);
    } else if (kind === "slow") {
      slowmoT = 6;
      popup(x, y, "SLOW-MO", info.hue);
    } else if (kind === "laser") {
      laserT = 8; laserCd = 0;
      popup(x, y, "LASERS", info.hue);
    } else if (kind === "fire") {
      fireT = 8;
      popup(x, y, "FIREBALL", info.hue);
    } else if (kind === "gem") {
      addScore(300, x, y, info.hue);
    } else if (kind === "shrink") {
      shrinkT = 8; wideT = 0;
      popup(x, y, "SHRUNK!", info.hue);
      flash = 0.5;
      sfx.bad();
    }
    if (kind !== "shrink") sfx.power();
    burst(x, y, info.hue, 12, 160);
  }

  function init() {
    level = 1; combo = 0;
    clearPowers();
    paddle.x = W / 2;
    balls = [newBall()];
    buildLevel(1);
  }

  function update(dt) {
    if (slowmoT > 0) slowmoT -= dt;
    if (wideT > 0) wideT -= dt;
    if (fireT > 0) fireT -= dt;
    if (laserT > 0) laserT -= dt;
    if (shrinkT > 0) shrinkT -= dt;

    const targetW = shrinkT > 0 ? 52 : wideT > 0 ? 145 : diff.paddleW;
    paddle.w += (targetW - paddle.w) * Math.min(1, dt * 10);

    if (keys["ArrowLeft"] || keys["KeyA"]) { paddle.x -= 460 * dt; pointerX = null; }
    if (keys["ArrowRight"] || keys["KeyD"]) { paddle.x += 460 * dt; pointerX = null; }
    if (pointerX !== null) paddle.x += (pointerX - paddle.x) * Math.min(1, dt * 22);
    paddle.x = Math.max(paddle.w / 2, Math.min(W - paddle.w / 2, paddle.x));

    if (level >= 4) {
      const amp = Math.min(8 + (level - 4) * 3, 14);
      for (const br of bricks) {
        br.x = br.bx + Math.sin(pulse * 0.9 + br.row * 0.8) * amp * (br.row % 2 ? -1 : 1);
      }
    }

    if (laserT > 0) {
      laserCd -= dt;
      if (laserCd <= 0) {
        laserCd = 0.32;
        lasers.push({ x: paddle.x - paddle.w / 2 + 6, y: paddle.y });
        lasers.push({ x: paddle.x + paddle.w / 2 - 6, y: paddle.y });
        sfx.laser();
      }
    }
    for (let i = lasers.length - 1; i >= 0; i--) {
      const L = lasers[i];
      L.y -= 620 * dt;
      if (L.y < -20) { lasers.splice(i, 1); continue; }
      for (const br of bricks) {
        if (L.x > br.x && L.x < br.x + br.w && L.y > br.y && L.y < br.y + br.h) {
          damageBrick(br, false);
          lasers.splice(i, 1);
          break;
        }
      }
    }

    for (const b of balls) {
      if (b.stuck) { b.x = paddle.x; b.y = paddle.y - 10; continue; }
      const sp = ballSpeed();
      const cur = Math.hypot(b.vx, b.vy) || 1;
      b.vx = b.vx / cur * sp;
      b.vy = b.vy / cur * sp;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      trail(b.x, b.y, fireT > 0 ? 25 : slowmoT > 0 ? 280 : 195);

      if (b.x < 7) { b.x = 7; b.vx = Math.abs(b.vx); sfx.wall(); }
      if (b.x > W - 7) { b.x = W - 7; b.vx = -Math.abs(b.vx); sfx.wall(); }
      if (b.y < 7) { b.y = 7; b.vy = Math.abs(b.vy); sfx.wall(); }

      if (b.vy > 0 &&
          b.y > paddle.y - 8 && b.y < paddle.y + paddle.h &&
          b.x > paddle.x - paddle.w / 2 - 7 && b.x < paddle.x + paddle.w / 2 + 7) {
        const rel = (b.x - paddle.x) / (paddle.w / 2);
        const ang = -Math.PI / 2 + rel * 1.05;
        const s2 = ballSpeed();
        b.vx = Math.cos(ang) * s2;
        b.vy = Math.sin(ang) * s2;
        b.y = paddle.y - 8;
        combo = 0;
        sfx.paddle();
        burst(b.x, paddle.y, 190, 5, 110);
      }

      for (const br of bricks) {
        if (b.x + 7 < br.x || b.x - 7 > br.x + br.w || b.y + 7 < br.y || b.y - 7 > br.y + br.h) continue;
        const fiery = fireT > 0 && br.type !== "steel";
        if (!fiery) {
          const overlapX = Math.min(b.x + 7 - br.x, br.x + br.w - (b.x - 7));
          const overlapY = Math.min(b.y + 7 - br.y, br.y + br.h - (b.y - 7));
          if (overlapX < overlapY) b.vx = -b.vx; else b.vy = -b.vy;
        }
        damageBrick(br, fiery);
        break;
      }
    }

    balls = balls.filter(b => b.y < H + 20);
    if (balls.length === 0) { fail("BREAKOUT"); return; }

    for (let i = powerups.length - 1; i >= 0; i--) {
      const p = powerups[i];
      p.y += p.vy * dt;
      if (p.y > H + 20) { powerups.splice(i, 1); continue; }
      if (p.y > paddle.y - 8 && p.y < paddle.y + paddle.h + 10 &&
          p.x > paddle.x - paddle.w / 2 - 12 && p.x < paddle.x + paddle.w / 2 + 12) {
        applyPower(p.kind, p.x, p.y);
        powerups.splice(i, 1);
      }
    }

    if (!bricks.some(b => b.type !== "steel")) {
      addScore(100 * level, W / 2, H / 2, 140);
      level++;
      buildLevel(level);
      balls = [newBall()];
      clearPowers();
      sfx.level();
    }
  }

  function draw() {
    for (const br of bricks) {
      if (br.type === "steel") {
        glowRect(br.x, br.y, br.w, br.h, "hsl(220, 8%, 52%)", 6);
        ctx.strokeStyle = "rgba(255,255,255,0.35)";
        ctx.strokeRect(br.x + 2.5, br.y + 2.5, br.w - 5, br.h - 5);
        continue;
      }
      if (br.type === "boom") {
        const throb = 0.75 + 0.25 * Math.sin(pulse * 6);
        glowRect(br.x, br.y, br.w, br.h, `hsla(18, 100%, ${45 + throb * 15}%, 1)`, 16);
        ctx.fillStyle = "#0a0a14";
        ctx.font = "bold 12px monospace";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("✶", br.x + br.w / 2, br.y + br.h / 2 + 1);
        continue;
      }
      const a = br.hp === br.maxHp ? 1 : 0.55;
      glowRect(br.x, br.y, br.w, br.h, `hsla(${br.hue}, 95%, 60%, ${a})`, 10);
      if (br.maxHp > 1 && br.hp === br.maxHp) {
        ctx.strokeStyle = "rgba(255,255,255,0.7)";
        ctx.strokeRect(br.x + 2.5, br.y + 2.5, br.w - 5, br.h - 5);
      }
    }

    for (const L of lasers) glowRect(L.x - 1.5, L.y - 14, 3, 14, "#7df9ff", 10);

    for (const p of powerups) {
      const info = POWER_INFO[p.kind];
      ctx.save();
      ctx.shadowColor = `hsl(${info.hue},100%,60%)`;
      ctx.shadowBlur = 14;
      ctx.fillStyle = info.good ? `hsl(${info.hue},100%,60%)` : "#ff2222";
      ctx.beginPath();
      ctx.arc(p.x, p.y, 11, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#0a0a14";
      ctx.font = "bold 11px monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(info.label, p.x, p.y + 1);
      ctx.restore();
    }

    const pc = shrinkT > 0 ? "#ff2222" : wideT > 0 ? "hsl(130,100%,60%)" : laserT > 0 ? "#7df9ff" : "#00e5ff";
    glowRect(paddle.x - paddle.w / 2, paddle.y, paddle.w, paddle.h, pc, 16);
    if (laserT > 0) {
      glowRect(paddle.x - paddle.w / 2 + 3, paddle.y - 5, 6, 5, "#7df9ff", 8);
      glowRect(paddle.x + paddle.w / 2 - 9, paddle.y - 5, 6, 5, "#7df9ff", 8);
    }

    for (const b of balls) {
      ctx.save();
      const bc = fireT > 0 ? "hsl(25,100%,60%)" : slowmoT > 0 ? "hsl(280,100%,80%)" : "#ffffff";
      ctx.shadowColor = bc;
      ctx.shadowBlur = fireT > 0 ? 20 : 14;
      ctx.fillStyle = bc;
      ctx.beginPath();
      ctx.arc(b.x, b.y, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    if (combo > 1) {
      ctx.textAlign = "center";
      ctx.fillStyle = `hsl(${40 + combo * 10}, 100%, 60%)`;
      ctx.font = "bold 14px monospace";
      ctx.textBaseline = "alphabetic";
      ctx.fillText("COMBO ×" + combo, W / 2, 78);
    }
    const fx = [];
    if (laserT > 0) fx.push("⚡" + Math.ceil(laserT));
    if (fireT > 0) fx.push("◉" + Math.ceil(fireT));
    if (slowmoT > 0) fx.push("◐" + Math.ceil(slowmoT));
    if (wideT > 0) fx.push("⟷" + Math.ceil(wideT));
    if (shrinkT > 0) fx.push("☠" + Math.ceil(shrinkT));
    if (fx.length) {
      ctx.textAlign = "left";
      ctx.fillStyle = "#9ad7e8";
      ctx.font = "13px monospace";
      ctx.textBaseline = "alphabetic";
      ctx.fillText(fx.join("  "), 14, H - 14);
    }
    if (balls.some(b => b.stuck)) {
      ctx.fillStyle = "#9ad7e8";
      ctx.font = "14px monospace";
      ctx.textAlign = "center";
      ctx.globalAlpha = 0.6 + 0.4 * Math.sin(pulse * 5);
      ctx.fillText("tap / space to launch", W / 2, H - 90);
      ctx.globalAlpha = 1;
    }
  }

  function tap() {
    for (const b of balls) if (b.stuck) launchBall(b);
  }

  function onResume() {
    // mercy: a ball about to drop right as you arrive is unfair
    for (const b of balls) if (b.vy > 0 && b.y > H - 200) b.vy = -Math.abs(b.vy);
  }

  return { name: "BREAKOUT", hue: 185, hint: "move paddle · tap to launch", init, update, draw, tap, onResume };
}

// =======================================================
// GAME 2: FLAPPY
// =======================================================
function makeFlappy() {
  const BX = 110, R = 9;
  let bird, pipes, gameTime;

  function init() {
    bird = { y: H / 2, vy: 0 };
    pipes = [];
    gameTime = 0;
  }

  function update(dt) {
    gameTime += dt;
    bird.vy += 1150 * dt;
    bird.y += bird.vy * dt;
    trail(BX - 6, bird.y, 55);

    if (bird.y < R) { bird.y = R; bird.vy = 0; }
    if (bird.y > H - 16) { fail("FLAPPY"); return; }

    const speed = (150 + Math.min(gameTime * 2, 80)) * diff.speed;
    for (const p of pipes) p.x -= speed * dt;
    if (pipes.length && pipes[0].x < -70) pipes.shift();
    if (!pipes.length || pipes[pipes.length - 1].x < W - 210) {
      pipes.push({
        x: W + 30,
        gy: 170 + Math.random() * (H - 360),
        gh: Math.max(diff.flapGap - 35, diff.flapGap - gameTime * 1.5),
        passed: false
      });
    }

    for (const p of pipes) {
      if (!p.passed && p.x + 60 < BX) {
        p.passed = true;
        addScore(20, BX, bird.y - 20, 55);
        sfx.pass();
      }
      const top = p.gy - p.gh / 2, bot = p.gy + p.gh / 2;
      if (BX + R > p.x && BX - R < p.x + 60 && (bird.y - R < top || bird.y + R > bot)) {
        burst(BX, bird.y, 55, 24, 260);
        fail("FLAPPY");
        return;
      }
    }
  }

  function draw() {
    for (const p of pipes) {
      const top = p.gy - p.gh / 2, bot = p.gy + p.gh / 2;
      glowRect(p.x, 0, 60, top, "hsl(140, 95%, 50%)", 12);
      glowRect(p.x - 4, top - 14, 68, 14, "hsl(140, 95%, 60%)", 12);
      glowRect(p.x, bot, 60, H - bot, "hsl(140, 95%, 50%)", 12);
      glowRect(p.x - 4, bot, 68, 14, "hsl(140, 95%, 60%)", 12);
    }
    glowRect(0, H - 14, W, 3, "hsl(140, 60%, 40%)", 8);

    ctx.save();
    ctx.translate(BX, bird.y);
    ctx.rotate(Math.max(-0.5, Math.min(0.9, bird.vy / 500)));
    ctx.shadowColor = "hsl(55,100%,60%)";
    ctx.shadowBlur = 16;
    ctx.fillStyle = "hsl(55,100%,60%)";
    ctx.beginPath();
    ctx.arc(0, 0, R, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#0a0a14";
    ctx.beginPath();
    ctx.arc(3.5, -3, 2.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "hsl(30,100%,55%)";
    ctx.fillRect(7, -1, 6, 3);
    ctx.restore();
  }

  function tap() {
    bird.vy = -340;
    sfx.flap();
    burst(BX - 8, bird.y + 6, 55, 4, 90);
  }

  function onResume() { bird.vy = -120; }

  return { name: "FLAPPY", hue: 55, hint: "tap / space to flap", init, update, draw, tap, onResume };
}

// =======================================================
// GAME 3: SNAKE
// =======================================================
function makeSnake() {
  const CELL = 24, GX = 20, GY = 23, TOP = 72;
  const DIRS = [{ x: 0, y: -1 }, { x: 1, y: 0 }, { x: 0, y: 1 }, { x: -1, y: 0 }]; // U R D L
  let body, dirIdx, nextIdx, step, acc, food;

  function spawnFood() {
    while (true) {
      const f = { x: Math.floor(Math.random() * GX), y: Math.floor(Math.random() * GY) };
      if (!body.some(c => c.x === f.x && c.y === f.y)) return f;
    }
  }

  function init() {
    body = [{ x: 9, y: 11 }, { x: 8, y: 11 }, { x: 7, y: 11 }, { x: 6, y: 11 }];
    dirIdx = 1; nextIdx = 1;
    step = diff.snakeStep; acc = 0;
    food = spawnFood();
  }

  function setDir(i) {
    if ((i + 2) % 4 !== dirIdx) nextIdx = i;
  }

  function update(dt) {
    if (keys["ArrowUp"] || keys["KeyW"]) setDir(0);
    if (keys["ArrowRight"] || keys["KeyD"]) setDir(1);
    if (keys["ArrowDown"] || keys["KeyS"]) setDir(2);
    if (keys["ArrowLeft"] || keys["KeyA"]) setDir(3);

    acc += dt;
    while (acc >= step) {
      acc -= step;
      dirIdx = nextIdx;
      const d = DIRS[dirIdx];
      const head = { x: body[0].x + d.x, y: body[0].y + d.y };
      if (head.x < 0 || head.x >= GX || head.y < 0 || head.y >= GY ||
          body.slice(0, -1).some(c => c.x === head.x && c.y === head.y)) {
        burst(body[0].x * CELL + CELL / 2, TOP + body[0].y * CELL + CELL / 2, 130, 24, 260);
        fail("SNAKE");
        return;
      }
      body.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        addScore(20, head.x * CELL + CELL / 2, TOP + head.y * CELL, 320);
        sfx.eat();
        burst(head.x * CELL + CELL / 2, TOP + head.y * CELL + CELL / 2, 320, 10, 140);
        step = Math.max(0.07, step - 0.003 * diff.speed);
        food = spawnFood();
      } else {
        body.pop();
      }
    }
  }

  function draw() {
    ctx.strokeStyle = "rgba(0,229,255,0.35)";
    ctx.lineWidth = 2;
    ctx.strokeRect(1, TOP - 1, GX * CELL - 2, GY * CELL + 2);
    ctx.lineWidth = 1;

    const throb = 4 + Math.sin(pulse * 6) * 1.5;
    ctx.save();
    ctx.shadowColor = "hsl(320,100%,60%)";
    ctx.shadowBlur = 14;
    ctx.fillStyle = "hsl(320,100%,62%)";
    ctx.beginPath();
    ctx.arc(food.x * CELL + CELL / 2, TOP + food.y * CELL + CELL / 2, throb + 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    for (let i = body.length - 1; i >= 0; i--) {
      const c = body[i];
      const t = 1 - i / body.length;
      const col = i === 0 ? "hsl(130,100%,65%)" : `hsl(130, 90%, ${30 + t * 25}%)`;
      glowRect(c.x * CELL + 2, TOP + c.y * CELL + 2, CELL - 4, CELL - 4, col, i === 0 ? 14 : 6);
    }
    const h = body[0], d = DIRS[dirIdx];
    ctx.fillStyle = "#0a0a14";
    const cx = h.x * CELL + CELL / 2, cy = TOP + h.y * CELL + CELL / 2;
    ctx.fillRect(cx + d.x * 5 - d.y * 4 - 1.5, cy + d.y * 5 - d.x * 4 - 1.5, 3, 3);
    ctx.fillRect(cx + d.x * 5 + d.y * 4 - 1.5, cy + d.y * 5 + d.x * 4 - 1.5, 3, 3);
  }

  function tap(x) {
    if (x == null) return;
    if (x < W / 2) setDir((dirIdx + 3) % 4);
    else setDir((dirIdx + 1) % 4);
  }

  function freeAhead(i) {
    const d = DIRS[i];
    let h = body[0], n = 0;
    for (let s = 0; s < 6; s++) {
      h = { x: h.x + d.x, y: h.y + d.y };
      if (h.x < 0 || h.x >= GX || h.y < 0 || h.y >= GY ||
          body.some(c => c.x === h.x && c.y === h.y)) break;
      n++;
    }
    return n;
  }

  function onResume() {
    // mercy: being shuffled in while aimed at a wall 2 cells away is unfair
    if (freeAhead(nextIdx) < 4) {
      const L = (nextIdx + 3) % 4, R = (nextIdx + 1) % 4;
      nextIdx = freeAhead(L) >= freeAhead(R) ? L : R;
      dirIdx = nextIdx;
    }
    acc = -0.25; // brief beat before the first move
  }

  return { name: "SNAKE", hue: 130, hint: "arrows / WASD · tap sides to turn", init, update, draw, tap, onResume };
}

// =======================================================
// GAME 4: DODGE
// =======================================================
function makeDodge() {
  const SY = H - 50;
  let ship, rocks, spawnAcc, gameTime;

  function init() {
    ship = { x: W / 2 };
    rocks = [];
    spawnAcc = 0;
    gameTime = 0;
  }

  function update(dt) {
    gameTime += dt;

    if (keys["ArrowLeft"] || keys["KeyA"]) { ship.x -= 460 * dt; pointerX = null; }
    if (keys["ArrowRight"] || keys["KeyD"]) { ship.x += 460 * dt; pointerX = null; }
    if (pointerX !== null) ship.x += (pointerX - ship.x) * Math.min(1, dt * 22);
    ship.x = Math.max(16, Math.min(W - 16, ship.x));
    trail(ship.x + (Math.random() - 0.5) * 6, SY + 14, 190);

    spawnAcc += dt;
    const interval = Math.max(0.22, 0.55 - gameTime * 0.012) / diff.speed;
    while (spawnAcc >= interval) {
      spawnAcc -= interval;
      const r = 10 + Math.random() * 14;
      const verts = [];
      for (let i = 0; i < 8; i++) verts.push(0.7 + Math.random() * 0.5);
      rocks.push({
        x: 20 + Math.random() * (W - 40), y: -30, r,
        vy: (150 + Math.random() * 120 + Math.min(gameTime * 4, 140)) * diff.speed,
        a: Math.random() * Math.PI * 2, va: (Math.random() - 0.5) * 4,
        verts, hue: Math.random() < 0.5 ? 15 : 320
      });
    }

    for (let i = rocks.length - 1; i >= 0; i--) {
      const k = rocks[i];
      k.y += k.vy * dt;
      k.a += k.va * dt;
      if (k.y > H + 30) {
        rocks.splice(i, 1);
        addScore(2);
        continue;
      }
      if (Math.hypot(k.x - ship.x, k.y - SY) < k.r + 11) {
        burst(ship.x, SY, 190, 30, 300);
        fail("DODGE");
        return;
      }
    }
  }

  function draw() {
    for (const k of rocks) {
      ctx.save();
      ctx.translate(k.x, k.y);
      ctx.rotate(k.a);
      ctx.strokeStyle = `hsl(${k.hue}, 95%, 60%)`;
      ctx.shadowColor = `hsl(${k.hue}, 95%, 60%)`;
      ctx.shadowBlur = 10;
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const a = i / 8 * Math.PI * 2;
        const r = k.r * k.verts[i];
        if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
        else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      ctx.closePath();
      ctx.stroke();
      ctx.restore();
    }

    ctx.save();
    ctx.translate(ship.x, SY);
    ctx.shadowColor = "#00e5ff";
    ctx.shadowBlur = 16;
    ctx.fillStyle = "#00e5ff";
    ctx.beginPath();
    ctx.moveTo(0, -14);
    ctx.lineTo(11, 12);
    ctx.lineTo(0, 6);
    ctx.lineTo(-11, 12);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function tap() {}

  function onResume() {
    // mercy: clear rocks about to land on the ship
    rocks = rocks.filter(k => Math.hypot(k.x - ship.x, k.y - SY) > 130);
  }

  return { name: "DODGE", hue: 15, hint: "move to dodge the rocks", init, update, draw, tap, onResume };
}

// =======================================================
// GAME 5: PONG
// =======================================================
function makePong() {
  const P = { x: W / 2, w: 84, h: 12, y: H - 46 };
  const A = { x: W / 2, w: 84, h: 12, y: 70 };
  let ball, rally, serveT;

  function init() {
    P.x = W / 2; A.x = W / 2;
    ball = null;
    rally = 0;
    serveT = 0.7;
  }

  function speed() {
    return Math.min(300 + rally * 14, 560) * diff.speed;
  }

  function serve() {
    ball = { x: W / 2, y: H / 2 - 30, vx: (Math.random() - 0.5) * 220, vy: speed() };
  }

  function update(dt) {
    if (keys["ArrowLeft"] || keys["KeyA"]) { P.x -= 460 * dt; pointerX = null; }
    if (keys["ArrowRight"] || keys["KeyD"]) { P.x += 460 * dt; pointerX = null; }
    if (pointerX !== null) P.x += (pointerX - P.x) * Math.min(1, dt * 22);
    P.x = Math.max(P.w / 2, Math.min(W - P.w / 2, P.x));

    if (!ball) {
      serveT -= dt;
      if (serveT <= 0) serve();
      return;
    }

    // AI tracks with a wobble so it's beatable
    const target = ball.x + Math.sin(pulse * 3) * diff.pongErr;
    const dx = target - A.x;
    A.x += Math.max(-diff.pongAI * dt, Math.min(diff.pongAI * dt, dx));
    A.x = Math.max(A.w / 2, Math.min(W - A.w / 2, A.x));

    const sp = speed();
    const cur = Math.hypot(ball.vx, ball.vy) || 1;
    ball.vx = ball.vx / cur * sp;
    ball.vy = ball.vy / cur * sp;
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;
    trail(ball.x, ball.y, 210);

    if (ball.x < 7) { ball.x = 7; ball.vx = Math.abs(ball.vx); sfx.wall(); }
    if (ball.x > W - 7) { ball.x = W - 7; ball.vx = -Math.abs(ball.vx); sfx.wall(); }

    // player paddle
    if (ball.vy > 0 &&
        ball.y > P.y - 8 && ball.y < P.y + P.h &&
        ball.x > P.x - P.w / 2 - 7 && ball.x < P.x + P.w / 2 + 7) {
      const rel = (ball.x - P.x) / (P.w / 2);
      const ang = -Math.PI / 2 + rel * 1.0;
      const s2 = speed();
      ball.vx = Math.cos(ang) * s2;
      ball.vy = Math.sin(ang) * s2;
      ball.y = P.y - 8;
      rally++;
      sfx.paddle();
      burst(ball.x, P.y, 210, 5, 110);
    }

    // AI paddle
    if (ball.vy < 0 &&
        ball.y < A.y + A.h + 8 && ball.y > A.y &&
        ball.x > A.x - A.w / 2 - 7 && ball.x < A.x + A.w / 2 + 7) {
      const rel = (ball.x - A.x) / (A.w / 2);
      const ang = Math.PI / 2 - rel * 1.0;
      const s2 = speed();
      ball.vx = -Math.cos(ang + Math.PI) * s2;
      ball.vy = Math.abs(Math.sin(ang) * s2);
      ball.y = A.y + A.h + 8;
      ball.vx += rel * 80;
      sfx.wall();
      burst(ball.x, A.y + A.h, 330, 5, 110);
    }

    // past the AI = your point
    if (ball.y < 50) {
      addScore(50, ball.x, 90, 210);
      sfx.point();
      burst(ball.x, 60, 210, 16, 200);
      rally += 2;
      ball = null;
      serveT = 0.7;
      return;
    }
    // past you = game over
    if (ball.y > H + 12) {
      fail("PONG");
      return;
    }
  }

  function draw() {
    ctx.fillStyle = "rgba(160,200,255,0.18)";
    for (let x = 8; x < W; x += 30) ctx.fillRect(x, H / 2 - 1, 14, 2);

    glowRect(A.x - A.w / 2, A.y, A.w, A.h, "hsl(330,100%,60%)", 14);
    glowRect(P.x - P.w / 2, P.y, P.w, P.h, "#00e5ff", 16);

    if (ball) {
      ctx.save();
      ctx.shadowColor = "#ffffff";
      ctx.shadowBlur = 14;
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    } else {
      ctx.fillStyle = "#9ad7e8";
      ctx.font = "14px monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "alphabetic";
      ctx.globalAlpha = 0.6 + 0.4 * Math.sin(pulse * 5);
      ctx.fillText("serving...", W / 2, H / 2 + 40);
      ctx.globalAlpha = 1;
    }
    if (rally > 3) {
      ctx.fillStyle = "hsl(210,100%,70%)";
      ctx.font = "bold 13px monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "alphabetic";
      ctx.fillText("RALLY " + rally, W / 2, 100);
    }
  }

  function tap() {}

  function onResume() {
    // mercy: don't resume with the ball already past saving
    if (ball && ball.vy > 0 && ball.y > H - 160) { ball.y = H / 2; }
  }

  return { name: "PONG", hue: 210, hint: "beat the pink AI · don't let it past you", init, update, draw, tap, onResume };
}

// =======================================================
// GAME 6: RUNNER
// =======================================================
function makeRunner() {
  const GROUND = H - 70, PX = 90;
  let py, vy, obs, gameTime, spawnIn;

  function init() {
    py = GROUND; vy = 0;
    obs = [];
    gameTime = 0;
    spawnIn = 1.2;
  }

  function grounded() { return py >= GROUND - 0.5; }

  function update(dt) {
    gameTime += dt;
    const speed = (260 + Math.min(gameTime * 10, 220)) * diff.speed;

    vy += 1500 * dt;
    py += vy * dt;
    if (py > GROUND) { py = GROUND; vy = 0; }
    trail(PX - 8, py - 10, 90);

    spawnIn -= dt;
    if (spawnIn <= 0) {
      spawnIn = (0.75 + Math.random() * 0.85) / diff.speed;
      if (gameTime > 6 && Math.random() < 0.28) {
        obs.push({ type: "bar", x: W + 20, w: 52, passed: false }); // pass under, don't jump
      } else {
        obs.push({ type: "spike", x: W + 20, w: 16 + Math.random() * 16, h: 24 + Math.random() * 20, passed: false });
      }
    }

    const prect = { x: PX - 11, y: py - 22, w: 22, h: 22 };
    for (let i = obs.length - 1; i >= 0; i--) {
      const o = obs[i];
      o.x -= speed * dt;
      if (o.x + o.w < -10) { obs.splice(i, 1); continue; }
      if (!o.passed && o.x + o.w < PX - 11) {
        o.passed = true;
        addScore(5);
        sfx.pass();
      }
      const orect = o.type === "spike"
        ? { x: o.x, y: GROUND - o.h, w: o.w, h: o.h }
        : { x: o.x, y: GROUND - 62, w: o.w, h: 16 };
      if (prect.x < orect.x + orect.w && prect.x + prect.w > orect.x &&
          prect.y < orect.y + orect.h && prect.y + prect.h > orect.y) {
        burst(PX, py - 11, 90, 26, 280);
        fail("RUNNER");
        return;
      }
    }
  }

  function draw() {
    glowRect(0, GROUND + 2, W, 3, "hsl(90, 70%, 45%)", 10);
    // scrolling ground dashes
    const sp = (260 + Math.min(gameTime * 10, 220)) * diff.speed;
    const off = (gameTime * sp) % 60;
    ctx.fillStyle = "rgba(150,255,120,0.25)";
    for (let x = -off; x < W; x += 60) ctx.fillRect(x, GROUND + 14, 26, 2);

    for (const o of obs) {
      if (o.type === "spike") {
        ctx.save();
        ctx.fillStyle = "hsl(0, 95%, 58%)";
        ctx.shadowColor = "hsl(0, 95%, 58%)";
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.moveTo(o.x, GROUND);
        ctx.lineTo(o.x + o.w / 2, GROUND - o.h);
        ctx.lineTo(o.x + o.w, GROUND);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      } else {
        glowRect(o.x, GROUND - 62, o.w, 16, "hsl(280, 95%, 60%)", 12);
      }
    }

    // player
    ctx.save();
    ctx.shadowColor = "hsl(90,100%,60%)";
    ctx.shadowBlur = 16;
    ctx.fillStyle = "hsl(90,100%,60%)";
    const squash = grounded() ? 1 : 0.85;
    ctx.fillRect(PX - 11, py - 22 * squash, 22, 22 * squash);
    ctx.restore();
    ctx.fillStyle = "#0a0a14";
    ctx.fillRect(PX + 1, py - 16, 4, 4);
  }

  function tap() {
    if (grounded()) {
      vy = -580;
      sfx.jump();
      burst(PX, py, 90, 6, 100);
    }
  }

  function onResume() {
    // mercy: clear obstacles already on top of you
    obs = obs.filter(o => o.x > PX + 130 || o.x + o.w < PX - 40);
  }

  return { name: "RUNNER", hue: 90, hint: "tap / space to jump · go under purple bars", init, update, draw, tap, onResume };
}

// =======================================================
// GAME 7: STACK
// =======================================================
function makeStack() {
  const BH = 20, BASE = H - 80;
  let stack, cur, camY, dropIn;

  function rowY(i) { return BASE - i * BH; }

  function init() {
    stack = [{ x: W / 2 - diff.stackW / 2, w: diff.stackW }];
    camY = 0;
    newBlock();
  }

  function newBlock() {
    const top = stack[stack.length - 1];
    cur = {
      x: Math.random() < 0.5 ? -top.w : W,
      w: top.w,
      dir: 1,
      speed: (170 + stack.length * 9) * diff.speed
    };
    cur.dir = cur.x < 0 ? 1 : -1;
    dropIn = 4; // auto-drops if you stall — no hiding in STACK
  }

  function update(dt) {
    cur.x += cur.dir * cur.speed * dt;
    if (cur.x < 0) { cur.x = 0; cur.dir = 1; }
    if (cur.x + cur.w > W) { cur.x = W - cur.w; cur.dir = -1; }

    dropIn -= dt;
    if (dropIn <= 0) tap();

    const targetCam = Math.max(0, (stack.length - 14)) * BH;
    camY += (targetCam - camY) * Math.min(1, dt * 6);
  }

  function tap() {
    const top = stack[stack.length - 1];
    const left = Math.max(cur.x, top.x);
    const right = Math.min(cur.x + cur.w, top.x + top.w);
    const ov = right - left;
    const y = rowY(stack.length) + camY;

    if (ov <= 0) {
      burst(cur.x + cur.w / 2, y + BH / 2, 270, 26, 280);
      fail("STACK");
      return;
    }
    if (Math.abs(cur.x - top.x) < 5) {
      // perfect drop
      stack.push({ x: top.x, w: top.w });
      addScore(60, top.x + top.w / 2, y, 60);
      popup(top.x + top.w / 2, y - 18, "PERFECT", 60);
      burst(top.x + top.w / 2, y + BH / 2, 60, 14, 160);
      sfx.perfect();
    } else {
      // cut the overhang
      const cutX = cur.x < top.x ? cur.x : right;
      burst(cutX + (cur.w - ov) / 2, y + BH / 2, 270, 10, 140);
      stack.push({ x: left, w: ov });
      addScore(25, left + ov / 2, y, 270);
      sfx.drop();
    }
    newBlock();
  }

  function draw() {
    ctx.save();
    ctx.translate(0, camY);
    const from = Math.max(0, stack.length - 16);
    for (let i = from; i < stack.length; i++) {
      const b = stack[i];
      glowRect(b.x, rowY(i), b.w, BH - 3, `hsl(${(200 + i * 14) % 360}, 95%, 58%)`, 8);
    }
    // moving block
    const y = rowY(stack.length);
    const urgentFlash = dropIn < 1.2 ? 0.5 + 0.5 * Math.sin(pulse * 14) : 1;
    ctx.globalAlpha = urgentFlash;
    glowRect(cur.x, y, cur.w, BH - 3, `hsl(${(200 + stack.length * 14) % 360}, 100%, 70%)`, 16);
    ctx.globalAlpha = 1;
    ctx.restore();

    ctx.fillStyle = "#9ad7e8";
    ctx.font = "13px monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    ctx.fillText("height " + (stack.length - 1), W / 2, 78);
  }

  return { name: "STACK", hue: 270, hint: "tap to drop the block · stall and it drops itself", init, update, draw, tap };
}

// =======================================================
// GAME 8: INVADERS
// =======================================================
function makeInvaders() {
  const SY = H - 50;
  let ship, aliens, adir, pshots, eshots, fireCd, wave;

  function spawnWave() {
    aliens = [];
    for (let r = 0; r < 3; r++) {
      for (let c = 0; c < 6; c++) {
        aliens.push({ x: 75 + c * 66, y: 110 + r * 46, row: r });
      }
    }
    adir = 1;
  }

  function init() {
    ship = { x: W / 2 };
    pshots = []; eshots = [];
    fireCd = 0;
    wave = 1;
    spawnWave();
  }

  function update(dt) {
    if (keys["ArrowLeft"] || keys["KeyA"]) { ship.x -= 460 * dt; pointerX = null; }
    if (keys["ArrowRight"] || keys["KeyD"]) { ship.x += 460 * dt; pointerX = null; }
    if (pointerX !== null) ship.x += (pointerX - ship.x) * Math.min(1, dt * 22);
    ship.x = Math.max(16, Math.min(W - 16, ship.x));

    // autofire
    fireCd -= dt;
    if (fireCd <= 0) {
      fireCd = 0.42;
      pshots.push({ x: ship.x, y: SY - 18 });
      sfx.shoot();
    }

    // march
    const aspd = (26 + wave * 8 + (18 - aliens.length) * 3) * diff.speed;
    let minX = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const a of aliens) {
      a.x += adir * aspd * dt;
      minX = Math.min(minX, a.x); maxX = Math.max(maxX, a.x); maxY = Math.max(maxY, a.y);
    }
    if (aliens.length && (minX < 26 || maxX > W - 26)) {
      adir *= -1;
      for (const a of aliens) { a.y += 16; a.x += adir * 4; }
      sfx.wall();
    }
    if (maxY > SY - 40) { burst(ship.x, SY, 350, 30, 300); fail("INVADERS"); return; }

    // alien fire
    if (aliens.length && Math.random() < diff.invFire * dt * (1 + wave * 0.15)) {
      const a = aliens[Math.floor(Math.random() * aliens.length)];
      eshots.push({ x: a.x, y: a.y + 10 });
    }

    for (let i = pshots.length - 1; i >= 0; i--) {
      const s = pshots[i];
      s.y -= 520 * dt;
      if (s.y < 70) { pshots.splice(i, 1); continue; }
      for (let j = 0; j < aliens.length; j++) {
        const a = aliens[j];
        if (Math.abs(a.x - s.x) < 15 && Math.abs(a.y - s.y) < 12) {
          burst(a.x, a.y, 350 - a.row * 30, 12, 160);
          addScore(15, a.x, a.y, 350);
          aliens.splice(j, 1);
          pshots.splice(i, 1);
          sfx.brick(0);
          break;
        }
      }
    }

    for (let i = eshots.length - 1; i >= 0; i--) {
      const s = eshots[i];
      s.y += 250 * diff.speed * dt;
      if (s.y > H + 10) { eshots.splice(i, 1); continue; }
      if (Math.abs(s.x - ship.x) < 13 && Math.abs(s.y - SY) < 14) {
        burst(ship.x, SY, 190, 30, 300);
        fail("INVADERS");
        return;
      }
    }

    if (!aliens.length) {
      addScore(150, W / 2, H / 2, 140);
      wave++;
      spawnWave();
      eshots = [];
      sfx.level();
    }
  }

  function draw() {
    for (const a of aliens) {
      const hue = 350 - a.row * 35;
      const wob = Math.sin(pulse * 4 + a.x * 0.05) * 2;
      ctx.save();
      ctx.shadowColor = `hsl(${hue},95%,60%)`;
      ctx.shadowBlur = 10;
      ctx.fillStyle = `hsl(${hue},95%,60%)`;
      ctx.fillRect(a.x - 11, a.y - 7 + wob, 22, 14);
      ctx.fillRect(a.x - 9, a.y + 7 + wob, 4, 4);
      ctx.fillRect(a.x + 5, a.y + 7 + wob, 4, 4);
      ctx.fillRect(a.x - 8, a.y - 11 + wob, 3, 4);
      ctx.fillRect(a.x + 5, a.y - 11 + wob, 3, 4);
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#0a0a14";
      ctx.fillRect(a.x - 6, a.y - 3 + wob, 4, 4);
      ctx.fillRect(a.x + 2, a.y - 3 + wob, 4, 4);
      ctx.restore();
    }

    for (const s of pshots) glowRect(s.x - 1.5, s.y - 10, 3, 10, "#7df9ff", 8);
    for (const s of eshots) glowRect(s.x - 2, s.y - 8, 4, 8, "hsl(350,100%,60%)", 10);

    ctx.save();
    ctx.translate(ship.x, SY);
    ctx.shadowColor = "#00e5ff";
    ctx.shadowBlur = 16;
    ctx.fillStyle = "#00e5ff";
    ctx.beginPath();
    ctx.moveTo(0, -14);
    ctx.lineTo(11, 12);
    ctx.lineTo(0, 6);
    ctx.lineTo(-11, 12);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = "#9ad7e8";
    ctx.font = "13px monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    ctx.fillText("wave " + wave, W / 2, 78);
  }

  function tap() {}

  function onResume() {
    // mercy: clear shots already raining on you
    eshots = eshots.filter(s => s.y < H - 220);
  }

  return { name: "INVADERS", hue: 350, hint: "move to aim · ship fires by itself", init, update, draw, tap, onResume };
}

// =======================================================
// Session orchestration — the shuffle
// =======================================================
const GAMES = [makeBreakout(), makeFlappy(), makeSnake(), makeDodge(), makePong(), makeRunner(), makeStack(), makeInvaders()];
let current = GAMES[0];

function nextDelay() {
  if (Math.random() < diff.rapid) return 1.4 + Math.random() * 1.6; // ambush switch
  const [a, b] = diff.sw;
  return a + Math.random() * (b - a);
}

function startSwitch(first = false) {
  const others = GAMES.filter(g => g !== current);
  current = first ? GAMES[Math.floor(Math.random() * GAMES.length)]
                  : others[Math.floor(Math.random() * others.length)];
  overlayT = first ? 1.8 : 1.2;
  glitchT = 0.25;
  state = STATE.SWITCH;
  if (!first) { switches++; sfx.whoosh(); }
}

function startRun(key) {
  diff = DIFFS[key];
  score = 0;
  switches = 0;
  runTime = 0;
  particles = []; popups = [];
  paused = false;
  for (const g of GAMES) g.init();
  startSwitch(true);
}

// ---------- Input ----------
window.addEventListener("keydown", e => {
  keys[e.code] = true;
  if (e.code === "Space" || e.code === "Enter") { e.preventDefault(); primaryAction(null, null); }
  if (e.code === "KeyM") muted = !muted;
  if (e.code === "KeyP" && state === STATE.PLAY) paused = !paused;
  if (state === STATE.MENU) {
    if (e.code === "Digit1") startRun("easy");
    if (e.code === "Digit2") startRun("normal");
    if (e.code === "Digit3") startRun("hard");
  }
});
window.addEventListener("keyup", e => keys[e.code] = false);

canvas.addEventListener("pointermove", e => {
  const r = canvas.getBoundingClientRect();
  pointerX = (e.clientX - r.left) / r.width * W;
});
canvas.addEventListener("pointerdown", e => {
  const r = canvas.getBoundingClientRect();
  const px = (e.clientX - r.left) / r.width * W;
  const py = (e.clientY - r.top) / r.height * H;
  pointerX = px;
  primaryAction(px, py);
});

// difficulty buttons on the menu
const BTNS = [
  { key: "easy", y: 318 },
  { key: "normal", y: 378 },
  { key: "hard", y: 438 }
];
const BTN_W = 250, BTN_H = 46, BTN_X = W / 2 - BTN_W / 2;

function primaryAction(x, y) {
  if (state === STATE.MENU) {
    if (x == null) { startRun("normal"); return; } // space/enter = normal
    for (const b of BTNS) {
      if (x > BTN_X && x < BTN_X + BTN_W && y > b.y && y < b.y + BTN_H) {
        startRun(b.key);
        return;
      }
    }
  } else if (state === STATE.OVER) {
    if (overLock <= 0) state = STATE.MENU;
  } else if (state === STATE.PLAY) {
    if (paused) { paused = false; return; }
    current.tap(x, y);
  }
}

// ---------- Update ----------
function update(dt) {
  updateFx(dt);
  if (overLock > 0) overLock -= dt;
  if (glitchT > 0) glitchT -= dt;

  if (state === STATE.SWITCH) {
    overlayT -= dt;
    if (overlayT <= 0) {
      if (current.onResume) current.onResume();
      switchMax = nextDelay();
      switchTimer = switchMax;
      state = STATE.PLAY;
    }
    return;
  }

  if (state !== STATE.PLAY || paused) return;

  runTime += dt;
  switchTimer -= dt;
  if (switchTimer <= 0) { startSwitch(); return; }

  current.update(dt);
}

// ---------- Draw ----------
function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  ctx.fillStyle = "#0a0a14";
  ctx.fillRect(-10, -10, W + 20, H + 20);

  for (const s of stars) {
    ctx.fillStyle = "rgba(160,200,255,0.5)";
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }

  if (state !== STATE.MENU) {
    current.draw();

    for (const p of particles) {
      const t = 1 - p.life / p.max;
      ctx.fillStyle = `hsla(${p.hue}, 95%, 65%, ${t})`;
      ctx.fillRect(p.x, p.y, p.size * t + 1, p.size * t + 1);
    }
    for (const p of popups) {
      const t = 1 - p.life / 0.8;
      ctx.fillStyle = `hsla(${p.hue}, 100%, 70%, ${t})`;
      ctx.font = "bold 13px monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "alphabetic";
      ctx.fillText(p.txt, p.x, p.y);
    }

    // HUD
    ctx.textBaseline = "alphabetic";
    ctx.fillStyle = "#9ad7e8";
    ctx.font = "bold 16px monospace";
    ctx.textAlign = "left";
    ctx.fillText("SCORE " + score, 14, 28);
    ctx.font = "11px monospace";
    ctx.fillStyle = `hsl(${diff.hue}, 100%, 60%)`;
    ctx.fillText(diff.label + " ×" + diff.scoreMult, 14, 44);
    ctx.textAlign = "center";
    ctx.fillStyle = `hsl(${current.hue}, 100%, 65%)`;
    ctx.font = "bold 16px monospace";
    ctx.fillText(current.name, W / 2, 28);
    ctx.textAlign = "right";
    ctx.fillStyle = "#5a7a8a";
    ctx.font = "13px monospace";
    ctx.fillText("BEST " + highs[diff.key], W - 14, 28);
  }

  ctx.textAlign = "center";

  if (state === STATE.MENU) {
    drawTitle();
    ctx.fillStyle = "#9ad7e8";
    ctx.font = "14px monospace";
    ctx.fillText("8 games · 1 life · it switches without warning", W / 2, 232);
    ctx.fillStyle = "#5a7a8a";
    ctx.font = "12px monospace";
    ctx.fillText("BREAKOUT FLAPPY SNAKE DODGE", W / 2, 262);
    ctx.fillText("PONG RUNNER STACK INVADERS", W / 2, 280);

    for (const b of BTNS) {
      const d = DIFFS[b.key];
      const hov = Math.sin(pulse * 4 + b.y) * 0.06;
      ctx.save();
      ctx.shadowColor = `hsl(${d.hue}, 100%, 55%)`;
      ctx.shadowBlur = b.key === "hard" ? 18 + Math.sin(pulse * 8) * 6 : 12;
      ctx.fillStyle = `hsla(${d.hue}, 100%, 55%, ${0.16 + hov})`;
      ctx.fillRect(BTN_X, b.y, BTN_W, BTN_H);
      ctx.strokeStyle = `hsl(${d.hue}, 100%, 58%)`;
      ctx.lineWidth = 2;
      ctx.strokeRect(BTN_X, b.y, BTN_W, BTN_H);
      ctx.restore();
      ctx.fillStyle = `hsl(${d.hue}, 100%, 65%)`;
      ctx.font = "bold 19px monospace";
      const label = b.key === "hard" ? "☠ HARD ☠" : d.label;
      ctx.fillText(label, W / 2, b.y + 24);
      ctx.fillStyle = "#7a9aaa";
      ctx.font = "11px monospace";
      const sub = b.key === "easy" ? "gentle · ×1 score"
                : b.key === "normal" ? "fair · ×1.5 score"
                : "no mercy · ×2.5 score";
      const best = highs[b.key] ? " · best " + highs[b.key] : "";
      ctx.fillText(sub + best, W / 2, b.y + 39);
    }

    ctx.fillStyle = "#5a7a8a";
    ctx.font = "12px monospace";
    ctx.fillText("tap a level · or press 1 / 2 / 3", W / 2, 520);
    ctx.fillText("P pause · M mute", W / 2, 540);
  }

  if (state === STATE.SWITCH) {
    veil();
    ctx.fillStyle = "#9ad7e8";
    ctx.font = "bold 15px monospace";
    ctx.fillText("UP NEXT", W / 2, H / 2 - 64);
    ctx.save();
    ctx.fillStyle = `hsl(${current.hue}, 100%, 62%)`;
    ctx.shadowColor = `hsl(${current.hue}, 100%, 62%)`;
    ctx.shadowBlur = 24;
    ctx.font = "bold 42px monospace";
    ctx.fillText(current.name, W / 2, H / 2 - 16);
    ctx.restore();
    ctx.fillStyle = "#9ad7e8";
    ctx.font = "14px monospace";
    ctx.fillText(current.hint, W / 2, H / 2 + 18);
  }

  if (state === STATE.PLAY && paused) {
    veil();
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 28px monospace";
    ctx.fillText("PAUSED", W / 2, H / 2);
    ctx.font = "14px monospace";
    ctx.fillStyle = "#9ad7e8";
    ctx.fillText("press P or click to resume", W / 2, H / 2 + 30);
  }

  if (state === STATE.OVER) {
    veil();
    ctx.fillStyle = "#ff3b6b";
    ctx.font = "bold 34px monospace";
    ctx.shadowColor = "#ff3b6b";
    ctx.shadowBlur = 22;
    ctx.fillText("GAME OVER", W / 2, H / 2 - 70);
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#9ad7e8";
    ctx.font = "15px monospace";
    ctx.fillText("wiped out in " + failedIn + " · " + diff.label, W / 2, H / 2 - 38);
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 18px monospace";
    ctx.fillText("SCORE " + score, W / 2, H / 2);
    ctx.fillStyle = "#9ad7e8";
    ctx.font = "13px monospace";
    ctx.fillText("survived " + switches + (switches === 1 ? " switch · " : " switches · ") + Math.round(runTime) + "s", W / 2, H / 2 + 26);
    if (score >= highs[diff.key] && score > 0) {
      ctx.fillStyle = "#ffd54a";
      ctx.font = "bold 16px monospace";
      ctx.fillText("★ NEW HIGH SCORE ★", W / 2, H / 2 + 54);
    } else {
      ctx.fillStyle = "#9ad7e8";
      ctx.font = "14px monospace";
      ctx.fillText("best " + highs[diff.key], W / 2, H / 2 + 54);
    }
    if (overLock <= 0) {
      ctx.fillStyle = "#9ad7e8";
      ctx.font = "15px monospace";
      pulseText("tap to play again", W / 2, H / 2 + 96);
    }
  }

  // switch glitch effect
  if (glitchT > 0) {
    for (let i = 0; i < 5; i++) {
      const y = Math.random() * H, h = 4 + Math.random() * 14;
      const dx = (Math.random() - 0.5) * 30;
      ctx.drawImage(canvas, 0, y, W, h, dx, y, W, h);
    }
  }

  if (flash > 0) {
    ctx.fillStyle = `rgba(255, 40, 80, ${flash * 0.25})`;
    ctx.fillRect(-10, -10, W + 20, H + 20);
  }

  if (muted) {
    ctx.fillStyle = "#5a7a8a";
    ctx.font = "12px monospace";
    ctx.textAlign = "right";
    ctx.fillText("🔇", W - 14, H - 32);
  }

  ctx.restore();
}

function veil() {
  ctx.fillStyle = "rgba(10,10,20,0.72)";
  ctx.fillRect(-10, -10, W + 20, H + 20);
}

function pulseText(txt, x, y) {
  ctx.save();
  ctx.globalAlpha = 0.6 + 0.4 * Math.sin(pulse * 5);
  ctx.fillText(txt, x, y);
  ctx.restore();
}

function drawTitle() {
  ctx.save();
  ctx.textAlign = "center";
  ctx.font = "bold 44px monospace";
  ctx.shadowBlur = 26;
  ctx.shadowColor = "#00e5ff";
  ctx.fillStyle = "#00e5ff";
  ctx.fillText("NEON", W / 2, 130);
  ctx.shadowColor = "#ff3b6b";
  ctx.fillStyle = "#ff3b6b";
  ctx.fillText("SHUFFLE", W / 2, 178);
  ctx.restore();
}

// ---------- Loop ----------
let last = performance.now();
function loop(now) {
  let dt = Math.min((now - last) / 1000, 0.033);
  last = now;
  pulse += dt;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
