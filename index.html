<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Neon Breakout</title>
<meta name="description" content="Neon Breakout — a free juiced-up arcade brick breaker. Play in your browser.">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #0a0a14;
    overflow: hidden;
    touch-action: none;
    font-family: "Courier New", monospace;
  }
  #wrap {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    background: #0a0a14;
    box-shadow: 0 0 60px rgba(0, 229, 255, 0.12);
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<script>
"use strict";

// ---------- Setup ----------
const W = 480, H = 640;
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = W;
canvas.height = H;

function fitCanvas() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = Math.floor(W * s) + "px";
  canvas.style.height = Math.floor(H * s) + "px";
}
window.addEventListener("resize", fitCanvas);
fitCanvas();

// ---------- Audio (tiny WebAudio synth) ----------
let audioCtx = null, muted = false;
function beep(freq, dur = 0.06, type = "square", vol = 0.08, slide = 0) {
  if (muted) return;
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { muted = true; return; }
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(audioCtx.destination);
  o.start(t);
  o.stop(t + dur);
}
const sfx = {
  paddle: () => beep(220, 0.05, "square", 0.07),
  wall:   () => beep(160, 0.04, "square", 0.05),
  brick:  (combo) => beep(330 + Math.min(combo, 12) * 40, 0.06, "square", 0.08),
  power:  () => { beep(440, 0.09, "sine", 0.1, 440); },
  lose:   () => beep(180, 0.35, "sawtooth", 0.1, -120),
  level:  () => { beep(523, 0.1, "sine", 0.1); setTimeout(() => beep(659, 0.1, "sine", 0.1), 100); setTimeout(() => beep(784, 0.15, "sine", 0.1), 200); },
  over:   () => { beep(300, 0.2, "sawtooth", 0.1, -150); setTimeout(() => beep(200, 0.4, "sawtooth", 0.1, -120), 180); }
};

// ---------- State ----------
const STATE = { MENU: 0, PLAY: 1, LEVELUP: 2, OVER: 3 };
let state = STATE.MENU;
let score = 0, lives = 3, level = 1, combo = 0;
let high = +(localStorage.getItem("nb_high") || 0);
let shake = 0, flash = 0, levelTimer = 0;
let slowmoT = 0; // slow-ball power-up timer
let wideT = 0;   // wide paddle timer

const paddle = { x: W / 2, w: 90, h: 12, y: H - 46 };
let balls = [];       // {x,y,vx,vy,stuck}
let bricks = [];      // {x,y,w,h,hp,maxHp,hue}
let particles = [];   // {x,y,vx,vy,life,max,hue,size}
let powerups = [];    // {x,y,vy,kind}  kind: 'multi'|'wide'|'slow'
let stars = [];       // background

for (let i = 0; i < 70; i++) {
  stars.push({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 1.5 + 0.3, v: Math.random() * 12 + 4 });
}

const BASE_SPEED = 300;
function ballSpeed() {
  const sp = BASE_SPEED + (level - 1) * 22;
  return slowmoT > 0 ? sp * 0.6 : sp;
}

function newBall(stuck = true) {
  return { x: paddle.x, y: paddle.y - 10, vx: 0, vy: 0, stuck };
}

function launchBall(b) {
  const a = (-Math.PI / 2) + (Math.random() * 0.8 - 0.4);
  const sp = ballSpeed();
  b.vx = Math.cos(a) * sp;
  b.vy = Math.sin(a) * sp;
  b.stuck = false;
}

function buildLevel(n) {
  bricks = [];
  const cols = 10, rows = Math.min(5 + Math.floor(n / 2), 9);
  const bw = 42, bh = 18, gap = 4;
  const ox = (W - cols * (bw + gap) + gap) / 2;
  const oy = 70;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      // carve some patterns so levels feel different
      if (n % 3 === 2 && (r + c) % 2 === 0 && r > 1) continue;
      if (n % 3 === 0 && c > 1 && c < cols - 2 && r === Math.floor(rows / 2)) continue;
      const tough = n > 1 && r < 2 && Math.random() < Math.min(0.2 + n * 0.06, 0.7);
      bricks.push({
        x: ox + c * (bw + gap), y: oy + r * (bh + gap),
        w: bw, h: bh,
        hp: tough ? 2 : 1, maxHp: tough ? 2 : 1,
        hue: 180 + r * 28
      });
    }
  }
}

function resetGame() {
  score = 0; lives = 3; level = 1; combo = 0;
  slowmoT = 0; wideT = 0; paddle.w = 90;
  powerups = [];
  balls = [newBall()];
  buildLevel(1);
}

// ---------- Effects ----------
function burst(x, y, hue, n = 14, speed = 220) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const v = Math.random() * speed + 40;
    particles.push({
      x, y,
      vx: Math.cos(a) * v, vy: Math.sin(a) * v,
      life: 0, max: Math.random() * 0.5 + 0.25,
      hue, size: Math.random() * 3 + 1.5
    });
  }
}

// ---------- Input ----------
let keys = {};
function targetXFromEvent(clientX) {
  const r = canvas.getBoundingClientRect();
  return (clientX - r.left) / r.width * W;
}
let pointerX = null;

window.addEventListener("keydown", e => {
  keys[e.code] = true;
  if (e.code === "Space" || e.code === "Enter") { e.preventDefault(); primaryAction(); }
  if (e.code === "KeyM") muted = !muted;
  if (e.code === "KeyP" && state === STATE.PLAY) paused = !paused;
});
window.addEventListener("keyup", e => keys[e.code] = false);

canvas.addEventListener("pointermove", e => { pointerX = targetXFromEvent(e.clientX); });
canvas.addEventListener("pointerdown", e => {
  pointerX = targetXFromEvent(e.clientX);
  primaryAction();
});

let paused = false;

function primaryAction() {
  if (state === STATE.MENU || state === STATE.OVER) {
    resetGame();
    state = STATE.PLAY;
  } else if (state === STATE.PLAY) {
    if (paused) { paused = false; return; }
    for (const b of balls) if (b.stuck) launchBall(b);
  }
}

// ---------- Update ----------
function update(dt) {
  // background stars always drift
  for (const s of stars) {
    s.y += s.v * dt;
    if (s.y > H) { s.y = -2; s.x = Math.random() * W; }
  }

  if (state !== STATE.PLAY || paused) return;

  // timers
  if (slowmoT > 0) slowmoT -= dt;
  if (wideT > 0) {
    wideT -= dt;
    if (wideT <= 0) paddle.w = 90;
  }
  if (shake > 0) shake = Math.max(0, shake - dt * 30);
  if (flash > 0) flash = Math.max(0, flash - dt * 3);

  // paddle movement: pointer wins if it moved recently, else keys
  if (keys["ArrowLeft"] || keys["KeyA"]) { paddle.x -= 460 * dt; pointerX = null; }
  if (keys["ArrowRight"] || keys["KeyD"]) { paddle.x += 460 * dt; pointerX = null; }
  if (pointerX !== null) paddle.x += (pointerX - paddle.x) * Math.min(1, dt * 22);
  paddle.x = Math.max(paddle.w / 2, Math.min(W - paddle.w / 2, paddle.x));

  // balls
  for (const b of balls) {
    if (b.stuck) { b.x = paddle.x; b.y = paddle.y - 10; continue; }

    // keep speed normalized to current target speed
    const sp = ballSpeed();
    const cur = Math.hypot(b.vx, b.vy) || 1;
    b.vx = b.vx / cur * sp;
    b.vy = b.vy / cur * sp;

    b.x += b.vx * dt;
    b.y += b.vy * dt;

    // walls
    if (b.x < 7) { b.x = 7; b.vx = Math.abs(b.vx); sfx.wall(); }
    if (b.x > W - 7) { b.x = W - 7; b.vx = -Math.abs(b.vx); sfx.wall(); }
    if (b.y < 7) { b.y = 7; b.vy = Math.abs(b.vy); sfx.wall(); }

    // paddle
    if (b.vy > 0 &&
        b.y > paddle.y - 8 && b.y < paddle.y + paddle.h &&
        b.x > paddle.x - paddle.w / 2 - 7 && b.x < paddle.x + paddle.w / 2 + 7) {
      const rel = (b.x - paddle.x) / (paddle.w / 2); // -1..1
      const ang = -Math.PI / 2 + rel * 1.05;
      const s2 = ballSpeed();
      b.vx = Math.cos(ang) * s2;
      b.vy = Math.sin(ang) * s2;
      b.y = paddle.y - 8;
      combo = 0;
      sfx.paddle();
      burst(b.x, paddle.y, 190, 5, 110);
    }

    // bricks
    for (let i = bricks.length - 1; i >= 0; i--) {
      const br = bricks[i];
      if (b.x + 7 < br.x || b.x - 7 > br.x + br.w || b.y + 7 < br.y || b.y - 7 > br.y + br.h) continue;

      // pick bounce axis from penetration depth
      const overlapX = Math.min(b.x + 7 - br.x, br.x + br.w - (b.x - 7));
      const overlapY = Math.min(b.y + 7 - br.y, br.y + br.h - (b.y - 7));
      if (overlapX < overlapY) b.vx = -b.vx; else b.vy = -b.vy;

      br.hp--;
      if (br.hp <= 0) {
        bricks.splice(i, 1);
        combo++;
        score += 10 * combo;
        shake = Math.min(shake + 2.5, 7);
        burst(br.x + br.w / 2, br.y + br.h / 2, br.hue, 16);
        sfx.brick(combo);
        // chance to drop a power-up
        if (Math.random() < 0.12) {
          const kinds = ["multi", "wide", "slow"];
          powerups.push({ x: br.x + br.w / 2, y: br.y + br.h / 2, vy: 120, kind: kinds[Math.floor(Math.random() * kinds.length)] });
        }
      } else {
        score += 5;
        shake = Math.min(shake + 1, 5);
        burst(br.x + br.w / 2, br.y + br.h / 2, br.hue, 6, 120);
        sfx.brick(0);
      }
      break; // one brick per frame per ball
    }
  }

  // remove fallen balls
  balls = balls.filter(b => b.y < H + 20);
  if (balls.length === 0) {
    lives--;
    combo = 0;
    flash = 1;
    shake = 8;
    sfx.lose();
    if (lives <= 0) {
      state = STATE.OVER;
      sfx.over();
      if (score > high) { high = score; localStorage.setItem("nb_high", high); }
    } else {
      balls = [newBall()];
    }
  }

  // power-ups falling
  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i];
    p.y += p.vy * dt;
    if (p.y > H + 20) { powerups.splice(i, 1); continue; }
    if (p.y > paddle.y - 8 && p.y < paddle.y + paddle.h + 10 &&
        p.x > paddle.x - paddle.w / 2 - 12 && p.x < paddle.x + paddle.w / 2 + 12) {
      applyPower(p.kind);
      burst(p.x, p.y, 60, 12, 160);
      sfx.power();
      powerups.splice(i, 1);
    }
  }

  // particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life += dt;
    if (p.life > p.max) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 300 * dt;
    p.vx *= 0.99;
  }

  // level clear
  if (bricks.length === 0 && state === STATE.PLAY) {
    state = STATE.LEVELUP;
    levelTimer = 1.6;
    score += 100 * level;
    sfx.level();
  }
}

function applyPower(kind) {
  if (kind === "multi") {
    const extra = [];
    for (const b of balls) {
      if (b.stuck) continue;
      for (const da of [-0.5, 0.5]) {
        const sp = Math.hypot(b.vx, b.vy);
        const a = Math.atan2(b.vy, b.vx) + da;
        extra.push({ x: b.x, y: b.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, stuck: false });
      }
      break; // split only the first live ball, keeps counts sane
    }
    if (extra.length === 0 && balls[0]) launchBall(balls[0]);
    balls.push(...extra);
  } else if (kind === "wide") {
    paddle.w = 140;
    wideT = 10;
  } else if (kind === "slow") {
    slowmoT = 6;
  }
}

function tickLevelup(dt) {
  levelTimer -= dt;
  if (levelTimer <= 0) {
    level++;
    buildLevel(level);
    balls = [newBall()];
    powerups = [];
    slowmoT = 0; wideT = 0; paddle.w = 90;
    state = STATE.PLAY;
  }
}

// ---------- Draw ----------
function glowRect(x, y, w, h, color, blur = 12) {
  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = blur;
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w, h);
  ctx.restore();
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  ctx.fillStyle = "#0a0a14";
  ctx.fillRect(-10, -10, W + 20, H + 20);

  // stars
  for (const s of stars) {
    ctx.fillStyle = "rgba(160,200,255,0.5)";
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }

  // bricks
  for (const br of bricks) {
    const a = br.hp === br.maxHp ? 1 : 0.55;
    const c = `hsla(${br.hue}, 95%, 60%, ${a})`;
    glowRect(br.x, br.y, br.w, br.h, c, 10);
    if (br.maxHp > 1 && br.hp === br.maxHp) {
      ctx.strokeStyle = "rgba(255,255,255,0.7)";
      ctx.strokeRect(br.x + 2.5, br.y + 2.5, br.w - 5, br.h - 5);
    }
  }

  // power-ups
  for (const p of powerups) {
    const label = p.kind === "multi" ? "×3" : p.kind === "wide" ? "⟷" : "◐";
    const hue = p.kind === "multi" ? 50 : p.kind === "wide" ? 130 : 280;
    ctx.save();
    ctx.shadowColor = `hsl(${hue},100%,60%)`;
    ctx.shadowBlur = 14;
    ctx.fillStyle = `hsl(${hue},100%,60%)`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 11, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#0a0a14";
    ctx.font = "bold 11px monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(label, p.x, p.y + 1);
    ctx.restore();
  }

  // particles
  for (const p of particles) {
    const t = 1 - p.life / p.max;
    ctx.fillStyle = `hsla(${p.hue}, 95%, 65%, ${t})`;
    ctx.fillRect(p.x, p.y, p.size * t + 1, p.size * t + 1);
  }

  if (state !== STATE.MENU) {
    // paddle
    const pc = wideT > 0 ? "hsl(130,100%,60%)" : "#00e5ff";
    glowRect(paddle.x - paddle.w / 2, paddle.y, paddle.w, paddle.h, pc, 16);

    // balls
    for (const b of balls) {
      ctx.save();
      ctx.shadowColor = slowmoT > 0 ? "hsl(280,100%,70%)" : "#ffffff";
      ctx.shadowBlur = 14;
      ctx.fillStyle = slowmoT > 0 ? "hsl(280,100%,80%)" : "#ffffff";
      ctx.beginPath();
      ctx.arc(b.x, b.y, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // HUD
    ctx.fillStyle = "#9ad7e8";
    ctx.font = "bold 16px monospace";
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    ctx.fillText("SCORE " + score, 14, 28);
    ctx.textAlign = "center";
    ctx.fillText("LVL " + level, W / 2, 28);
    ctx.textAlign = "right";
    ctx.fillText("♥".repeat(Math.max(0, lives)), W - 14, 28);
    if (combo > 1) {
      ctx.textAlign = "center";
      ctx.fillStyle = `hsl(${40 + combo * 10}, 100%, 60%)`;
      ctx.font = "bold 14px monospace";
      ctx.fillText("COMBO ×" + combo, W / 2, 48);
    }
  }

  ctx.textAlign = "center";

  if (state === STATE.MENU) {
    drawTitle();
    ctx.fillStyle = "#9ad7e8";
    ctx.font = "16px monospace";
    pulseText("CLICK / TAP / SPACE TO START", W / 2, H / 2 + 60);
    ctx.fillStyle = "#5a7a8a";
    ctx.font = "13px monospace";
    ctx.fillText("move: mouse · touch · ← → / A D", W / 2, H / 2 + 110);
    ctx.fillText("P pause · M mute", W / 2, H / 2 + 132);
    if (high > 0) {
      ctx.fillStyle = "#ffd54a";
      ctx.font = "bold 15px monospace";
      ctx.fillText("HIGH SCORE " + high, W / 2, H / 2 + 170);
    }
  }

  if (state === STATE.PLAY && balls.some(b => b.stuck)) {
    ctx.fillStyle = "#9ad7e8";
    ctx.font = "14px monospace";
    pulseText("click / tap / space to launch", W / 2, H - 90);
  }

  if (state === STATE.PLAY && paused) {
    veil();
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 28px monospace";
    ctx.fillText("PAUSED", W / 2, H / 2);
    ctx.font = "14px monospace";
    ctx.fillStyle = "#9ad7e8";
    ctx.fillText("press P or click to resume", W / 2, H / 2 + 30);
  }

  if (state === STATE.LEVELUP) {
    veil();
    ctx.fillStyle = "#00ffa6";
    ctx.font = "bold 30px monospace";
    ctx.shadowColor = "#00ffa6";
    ctx.shadowBlur = 20;
    ctx.fillText("LEVEL " + level + " CLEAR!", W / 2, H / 2 - 10);
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#9ad7e8";
    ctx.font = "15px monospace";
    ctx.fillText("+" + (100 * level) + " bonus", W / 2, H / 2 + 26);
  }

  if (state === STATE.OVER) {
    veil();
    ctx.fillStyle = "#ff3b6b";
    ctx.font = "bold 34px monospace";
    ctx.shadowColor = "#ff3b6b";
    ctx.shadowBlur = 22;
    ctx.fillText("GAME OVER", W / 2, H / 2 - 40);
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 18px monospace";
    ctx.fillText("SCORE " + score, W / 2, H / 2 + 4);
    if (score >= high && score > 0) {
      ctx.fillStyle = "#ffd54a";
      ctx.fillText("★ NEW HIGH SCORE ★", W / 2, H / 2 + 32);
    } else {
      ctx.fillStyle = "#9ad7e8";
      ctx.font = "15px monospace";
      ctx.fillText("best " + high, W / 2, H / 2 + 32);
    }
    ctx.fillStyle = "#9ad7e8";
    ctx.font = "15px monospace";
    pulseText("click / tap / space to retry", W / 2, H / 2 + 80);
  }

  // damage flash
  if (flash > 0) {
    ctx.fillStyle = `rgba(255, 40, 80, ${flash * 0.25})`;
    ctx.fillRect(-10, -10, W + 20, H + 20);
  }

  if (muted) {
    ctx.fillStyle = "#5a7a8a";
    ctx.font = "12px monospace";
    ctx.textAlign = "right";
    ctx.fillText("🔇", W - 14, H - 12);
  }

  ctx.restore();
}

function veil() {
  ctx.fillStyle = "rgba(10,10,20,0.72)";
  ctx.fillRect(-10, -10, W + 20, H + 20);
}

let pulse = 0;
function pulseText(txt, x, y) {
  ctx.save();
  ctx.globalAlpha = 0.6 + 0.4 * Math.sin(pulse * 5);
  ctx.fillText(txt, x, y);
  ctx.restore();
}

function drawTitle() {
  ctx.save();
  ctx.textAlign = "center";
  ctx.font = "bold 44px monospace";
  ctx.shadowBlur = 26;
  ctx.shadowColor = "#00e5ff";
  ctx.fillStyle = "#00e5ff";
  ctx.fillText("NEON", W / 2, H / 2 - 60);
  ctx.shadowColor = "#ff3b6b";
  ctx.fillStyle = "#ff3b6b";
  ctx.fillText("BREAKOUT", W / 2, H / 2 - 12);
  ctx.restore();
}

// ---------- Loop ----------
let last = performance.now();
function loop(now) {
  let dt = Math.min((now - last) / 1000, 0.033);
  last = now;
  pulse += dt;
  if (state === STATE.LEVELUP) tickLevelup(dt);
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
