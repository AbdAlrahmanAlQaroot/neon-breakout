<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Neon Breakout</title>
<meta name="description" content="Neon Breakout — a free juiced-up arcade brick breaker. Play in your browser.">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #0a0a14;
    overflow: hidden;
    touch-action: none;
    font-family: "Courier New", monospace;
  }
  #wrap {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    background: #0a0a14;
    box-shadow: 0 0 60px rgba(0, 229, 255, 0.12);
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<script>
"use strict";

// ---------- Setup ----------
const W = 480, H = 640;
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = W;
canvas.height = H;

function fitCanvas() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = Math.floor(W * s) + "px";
  canvas.style.height = Math.floor(H * s) + "px";
}
window.addEventListener("resize", fitCanvas);
fitCanvas();

// ---------- Audio (tiny WebAudio synth) ----------
let audioCtx = null, muted = false;
function beep(freq, dur = 0.06, type = "square", vol = 0.08, slide = 0) {
  if (muted) return;
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { muted = true; return; }
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(audioCtx.destination);
  o.start(t);
  o.stop(t + dur);
}
const sfx = {
  paddle: () => beep(220, 0.05, "square", 0.07),
  wall:   () => beep(160, 0.04, "square", 0.05),
  brick:  (combo) => beep(330 + Math.min(combo, 12) * 40, 0.06, "square", 0.08),
  steel:  () => beep(110, 0.05, "sawtooth", 0.06),
  boom:   () => beep(90, 0.3, "sawtooth", 0.14, -40),
  laser:  () => beep(880, 0.07, "square", 0.04, -500),
  power:  () => { beep(440, 0.09, "sine", 0.1, 440); },
  bad:    () => beep(140, 0.2, "sawtooth", 0.09, -60),
  life:   () => { beep(523, 0.08, "sine", 0.1); setTimeout(() => beep(784, 0.12, "sine", 0.1), 90); },
  lose:   () => beep(180, 0.35, "sawtooth", 0.1, -120),
  level:  () => { beep(523, 0.1, "sine", 0.1); setTimeout(() => beep(659, 0.1, "sine", 0.1), 100); setTimeout(() => beep(784, 0.15, "sine", 0.1), 200); },
  over:   () => { beep(300, 0.2, "sawtooth", 0.1, -150); setTimeout(() => beep(200, 0.4, "sawtooth", 0.1, -120), 180); }
};

// ---------- State ----------
const STATE = { MENU: 0, PLAY: 1, LEVELUP: 2, OVER: 3 };
let state = STATE.MENU;
let score = 0, lives = 3, level = 1, combo = 0;
let high = +(localStorage.getItem("nb_high") || 0);
let shake = 0, flash = 0, levelTimer = 0;
let slowmoT = 0, wideT = 0, fireT = 0, laserT = 0, shrinkT = 0, laserCd = 0;

const paddle = { x: W / 2, w: 90, h: 12, y: H - 46 };
let balls = [];       // {x,y,vx,vy,stuck}
let bricks = [];      // {x,bx,y,w,h,hp,maxHp,hue,type,row}  type: 'normal'|'boom'|'steel'
let particles = [];   // {x,y,vx,vy,life,max,hue,size,g}
let powerups = [];    // {x,y,vy,kind}
let lasers = [];      // {x,y}
let popups = [];      // {x,y,txt,hue,life}
let stars = [];       // background

for (let i = 0; i < 70; i++) {
  stars.push({ x: Math.random() * W, y: Math.random() * H, s: Math.random() * 1.5 + 0.3, v: Math.random() * 12 + 4 });
}

const BASE_SPEED = 300;
function ballSpeed() {
  const sp = BASE_SPEED + (level - 1) * 22;
  return slowmoT > 0 ? sp * 0.6 : sp;
}

function newBall(stuck = true) {
  return { x: paddle.x, y: paddle.y - 10, vx: 0, vy: 0, stuck };
}

function launchBall(b) {
  const a = (-Math.PI / 2) + (Math.random() * 0.8 - 0.4);
  const sp = ballSpeed();
  b.vx = Math.cos(a) * sp;
  b.vy = Math.sin(a) * sp;
  b.stuck = false;
}

function buildLevel(n) {
  bricks = [];
  const cols = 10, rows = Math.min(5 + Math.floor(n / 2), 9);
  const bw = 42, bh = 18, gap = 4;
  const ox = (W - cols * (bw + gap) + gap) / 2;
  const oy = 70;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      // carve some patterns so levels feel different
      if (n % 3 === 2 && (r + c) % 2 === 0 && r > 1) continue;
      if (n % 3 === 0 && c > 1 && c < cols - 2 && r === Math.floor(rows / 2)) continue;
      let type = "normal";
      const roll = Math.random();
      if (roll < 0.08) type = "boom";
      else if (n >= 3 && roll < 0.08 + Math.min(0.04 + n * 0.01, 0.12) && r > 0) type = "steel";
      const tough = type === "normal" && n > 1 && r < 2 && Math.random() < Math.min(0.2 + n * 0.06, 0.7);
      const x = ox + c * (bw + gap);
      bricks.push({
        x, bx: x, y: oy + r * (bh + gap),
        w: bw, h: bh, row: r,
        hp: type === "steel" ? Infinity : (tough ? 2 : 1),
        maxHp: tough ? 2 : 1,
        hue: 180 + r * 28,
        type
      });
    }
  }
}

function clearPowers() {
  slowmoT = 0; wideT = 0; fireT = 0; laserT = 0; shrinkT = 0;
  paddle.w = 90;
  powerups = []; lasers = [];
}

function resetGame() {
  score = 0; lives = 3; level = 1; combo = 0;
  clearPowers();
  popups = [];
  balls = [newBall()];
  buildLevel(1);
}

// ---------- Effects ----------
function burst(x, y, hue, n = 14, speed = 220) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const v = Math.random() * speed + 40;
    particles.push({
      x, y,
      vx: Math.cos(a) * v, vy: Math.sin(a) * v,
      life: 0, max: Math.random() * 0.5 + 0.25,
      hue, size: Math.random() * 3 + 1.5, g: 1
    });
  }
}

function trail(x, y, hue) {
  particles.push({ x, y, vx: 0, vy: 0, life: 0, max: 0.22, hue, size: 4, g: 0 });
}

function popup(x, y, txt, hue) {
  popups.push({ x, y, txt, hue, life: 0 });
}

// ---------- Bricks: damage / destroy / explode ----------
function destroyBrick(br) {
  const i = bricks.indexOf(br);
  if (i === -1) return; // already gone (chain explosions)
  bricks.splice(i, 1);
  combo++;
  const pts = 10 * combo;
  score += pts;
  shake = Math.min(shake + 2.5, 8);
  burst(br.x + br.w / 2, br.y + br.h / 2, br.type === "steel" ? 0 : br.hue, 16);
  popup(br.x + br.w / 2, br.y, "+" + pts, br.type === "boom" ? 25 : br.hue);
  sfx.brick(combo);
  if (Math.random() < 0.14) {
    powerups.push({ x: br.x + br.w / 2, y: br.y + br.h / 2, vy: 120, kind: pickPower() });
  }
  if (br.type === "boom") explode(br);
}

function explode(br) {
  const cx = br.x + br.w / 2, cy = br.y + br.h / 2;
  shake = Math.min(shake + 6, 12);
  burst(cx, cy, 25, 30, 320);
  burst(cx, cy, 50, 16, 180);
  sfx.boom();
  // blast radius takes out neighbors — including steel; booms chain
  const hit = bricks.filter(o => {
    const dx = (o.x + o.w / 2) - cx, dy = (o.y + o.h / 2) - cy;
    return Math.hypot(dx, dy) < 78;
  });
  for (const o of hit) destroyBrick(o);
}

// returns true if the projectile should pass through / stop, false if it should bounce
function damageBrick(br, instant) {
  if (br.type === "steel" && !instant) {
    burst(br.x + br.w / 2, br.y + br.h / 2, 0, 4, 90);
    sfx.steel();
    return;
  }
  if (instant || br.hp <= 1) {
    destroyBrick(br);
  } else {
    br.hp--;
    score += 5;
    shake = Math.min(shake + 1, 5);
    burst(br.x + br.w / 2, br.y + br.h / 2, br.hue, 6, 120);
    sfx.brick(0);
  }
}

function pickPower() {
  // weighted: helpful drops common, life rare, skull keeps you honest
  const pool = [
    ["multi", 17], ["laser", 17], ["fire", 15], ["wide", 13],
    ["slow", 13], ["shrink", 17], ["life", 8]
  ];
  let r = Math.random() * pool.reduce((s, p) => s + p[1], 0);
  for (const [k, w] of pool) { r -= w; if (r <= 0) return k; }
  return "multi";
}

// ---------- Input ----------
let keys = {};
function targetXFromEvent(clientX) {
  const r = canvas.getBoundingClientRect();
  return (clientX - r.left) / r.width * W;
}
let pointerX = null;

window.addEventListener("keydown", e => {
  keys[e.code] = true;
  if (e.code === "Space" || e.code === "Enter") { e.preventDefault(); primaryAction(); }
  if (e.code === "KeyM") muted = !muted;
  if (e.code === "KeyP" && state === STATE.PLAY) paused = !paused;
});
window.addEventListener("keyup", e => keys[e.code] = false);

canvas.addEventListener("pointermove", e => { pointerX = targetXFromEvent(e.clientX); });
canvas.addEventListener("pointerdown", e => {
  pointerX = targetXFromEvent(e.clientX);
  primaryAction();
});

let paused = false;

function primaryAction() {
  if (state === STATE.MENU || state === STATE.OVER) {
    resetGame();
    state = STATE.PLAY;
  } else if (state === STATE.PLAY) {
    if (paused) { paused = false; return; }
    for (const b of balls) if (b.stuck) launchBall(b);
  }
}

// ---------- Update ----------
function update(dt) {
  // background stars always drift
  for (const s of stars) {
    s.y += s.v * dt;
    if (s.y > H) { s.y = -2; s.x = Math.random() * W; }
  }

  if (state !== STATE.PLAY || paused) return;

  // timers
  if (slowmoT > 0) slowmoT -= dt;
  if (wideT > 0) wideT -= dt;
  if (fireT > 0) fireT -= dt;
  if (laserT > 0) laserT -= dt;
  if (shrinkT > 0) shrinkT -= dt;
  if (shake > 0) shake = Math.max(0, shake - dt * 30);
  if (flash > 0) flash = Math.max(0, flash - dt * 3);

  // paddle width follows active effects (skull overrides wide)
  const targetW = shrinkT > 0 ? 56 : wideT > 0 ? 140 : 90;
  paddle.w += (targetW - paddle.w) * Math.min(1, dt * 10);

  // paddle movement: pointer wins if it moved recently, else keys
  if (keys["ArrowLeft"] || keys["KeyA"]) { paddle.x -= 460 * dt; pointerX = null; }
  if (keys["ArrowRight"] || keys["KeyD"]) { paddle.x += 460 * dt; pointerX = null; }
  if (pointerX !== null) paddle.x += (pointerX - paddle.x) * Math.min(1, dt * 22);
  paddle.x = Math.max(paddle.w / 2, Math.min(W - paddle.w / 2, paddle.x));

  // swaying brick wall at higher levels — alternate rows move opposite ways
  if (level >= 4) {
    const amp = Math.min(8 + (level - 4) * 3, 14);
    for (const br of bricks) {
      br.x = br.bx + Math.sin(pulse * 0.9 + br.row * 0.8) * amp * (br.row % 2 ? -1 : 1);
    }
  }

  // laser fire
  if (laserT > 0) {
    laserCd -= dt;
    if (laserCd <= 0) {
      laserCd = 0.32;
      lasers.push({ x: paddle.x - paddle.w / 2 + 6, y: paddle.y });
      lasers.push({ x: paddle.x + paddle.w / 2 - 6, y: paddle.y });
      sfx.laser();
    }
  }
  for (let i = lasers.length - 1; i >= 0; i--) {
    const L = lasers[i];
    L.y -= 620 * dt;
    if (L.y < -20) { lasers.splice(i, 1); continue; }
    for (const br of bricks) {
      if (L.x > br.x && L.x < br.x + br.w && L.y > br.y && L.y < br.y + br.h) {
        damageBrick(br, false);
        lasers.splice(i, 1);
        break;
      }
    }
  }

  // balls
  for (const b of balls) {
    if (b.stuck) { b.x = paddle.x; b.y = paddle.y - 10; continue; }

    // keep speed normalized to current target speed
    const sp = ballSpeed();
    const cur = Math.hypot(b.vx, b.vy) || 1;
    b.vx = b.vx / cur * sp;
    b.vy = b.vy / cur * sp;

    b.x += b.vx * dt;
    b.y += b.vy * dt;
    trail(b.x, b.y, fireT > 0 ? 25 : slowmoT > 0 ? 280 : 195);

    // walls
    if (b.x < 7) { b.x = 7; b.vx = Math.abs(b.vx); sfx.wall(); }
    if (b.x > W - 7) { b.x = W - 7; b.vx = -Math.abs(b.vx); sfx.wall(); }
    if (b.y < 7) { b.y = 7; b.vy = Math.abs(b.vy); sfx.wall(); }

    // paddle
    if (b.vy > 0 &&
        b.y > paddle.y - 8 && b.y < paddle.y + paddle.h &&
        b.x > paddle.x - paddle.w / 2 - 7 && b.x < paddle.x + paddle.w / 2 + 7) {
      const rel = (b.x - paddle.x) / (paddle.w / 2); // -1..1
      const ang = -Math.PI / 2 + rel * 1.05;
      const s2 = ballSpeed();
      b.vx = Math.cos(ang) * s2;
      b.vy = Math.sin(ang) * s2;
      b.y = paddle.y - 8;
      combo = 0;
      sfx.paddle();
      burst(b.x, paddle.y, 190, 5, 110);
    }

    // bricks
    for (const br of bricks) {
      if (b.x + 7 < br.x || b.x - 7 > br.x + br.w || b.y + 7 < br.y || b.y - 7 > br.y + br.h) continue;
      const fiery = fireT > 0 && br.type !== "steel";
      if (!fiery) {
        // pick bounce axis from penetration depth
        const overlapX = Math.min(b.x + 7 - br.x, br.x + br.w - (b.x - 7));
        const overlapY = Math.min(b.y + 7 - br.y, br.y + br.h - (b.y - 7));
        if (overlapX < overlapY) b.vx = -b.vx; else b.vy = -b.vy;
      }
      damageBrick(br, fiery); // fireball pierces straight through
      break; // one brick per frame per ball
    }
  }

  // remove fallen balls
  balls = balls.filter(b => b.y < H + 20);
  if (balls.length === 0) {
    lives--;
    combo = 0;
    flash = 1;
    shake = 8;
    sfx.lose();
    if (lives <= 0) {
      state = STATE.OVER;
      sfx.over();
      if (score > high) { high = score; localStorage.setItem("nb_high", high); }
    } else {
      balls = [newBall()];
    }
  }

  // power-ups falling
  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i];
    p.y += p.vy * dt;
    if (p.y > H + 20) { powerups.splice(i, 1); continue; }
    if (p.y > paddle.y - 8 && p.y < paddle.y + paddle.h + 10 &&
        p.x > paddle.x - paddle.w / 2 - 12 && p.x < paddle.x + paddle.w / 2 + 12) {
      applyPower(p.kind, p.x, p.y);
      powerups.splice(i, 1);
    }
  }

  // particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life += dt;
    if (p.life > p.max) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 300 * dt * p.g;
    p.vx *= 0.99;
  }

  // score popups float up
  for (let i = popups.length - 1; i >= 0; i--) {
    const p = popups[i];
    p.life += dt;
    p.y -= 36 * dt;
    if (p.life > 0.8) popups.splice(i, 1);
  }

  // level clear — leftover steel bricks don't count
  if (state === STATE.PLAY && !bricks.some(b => b.type !== "steel")) {
    state = STATE.LEVELUP;
    levelTimer = 1.6;
    score += 100 * level;
    sfx.level();
  }
}

const POWER_INFO = {
  multi:  { label: "×3", hue: 50,  good: true },
  wide:   { label: "⟷",  hue: 130, good: true },
  slow:   { label: "◐",  hue: 280, good: true },
  laser:  { label: "⚡", hue: 190, good: true },
  fire:   { label: "◉",  hue: 25,  good: true },
  life:   { label: "♥",  hue: 340, good: true },
  shrink: { label: "☠",  hue: 0,   good: false }
};

function applyPower(kind, x, y) {
  const info = POWER_INFO[kind];
  if (kind === "multi") {
    const extra = [];
    for (const b of balls) {
      if (b.stuck) continue;
      for (const da of [-0.5, 0.5]) {
        const sp = Math.hypot(b.vx, b.vy);
        const a = Math.atan2(b.vy, b.vx) + da;
        extra.push({ x: b.x, y: b.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, stuck: false });
      }
      break; // split only the first live ball, keeps counts sane
    }
    if (extra.length === 0 && balls[0]) launchBall(balls[0]);
    balls.push(...extra);
    popup(x, y, "MULTIBALL", info.hue);
  } else if (kind === "wide") {
    wideT = 10; shrinkT = 0;
    popup(x, y, "WIDE", info.hue);
  } else if (kind === "slow") {
    slowmoT = 6;
    popup(x, y, "SLOW-MO", info.hue);
  } else if (kind === "laser") {
    laserT = 8; laserCd = 0;
    popup(x, y, "LASERS", info.hue);
  } else if (kind === "fire") {
    fireT = 8;
    popup(x, y, "FIREBALL", info.hue);
  } else if (kind === "life") {
    if (lives < 5) lives++;
    popup(x, y, "+1 LIFE", info.hue);
    sfx.life();
  } else if (kind === "shrink") {
    shrinkT = 8; wideT = 0;
    popup(x, y, "SHRUNK!", info.hue);
    flash = 0.5;
    sfx.bad();
  }
  if (kind !== "life" && kind !== "shrink") sfx.power();
  burst(x, y, info.hue, 12, 160);
}

function tickLevelup(dt) {
  levelTimer -= dt;
  if (levelTimer <= 0) {
    level++;
    buildLevel(level);
    balls = [newBall()];
    clearPowers();
    state = STATE.PLAY;
  }
}

// ---------- Draw ----------
function glowRect(x, y, w, h, color, blur = 12) {
  ctx.save();
  ctx.shadowColor = color;
  ctx.shadowBlur = blur;
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w, h);
  ctx.restore();
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  ctx.fillStyle = "#0a0a14";
  ctx.fillRect(-10, -10, W + 20, H + 20);

  // stars
  for (const s of stars) {
    ctx.fillStyle = "rgba(160,200,255,0.5)";
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }

  // bricks
  for (const br of bricks) {
    if (br.type === "steel") {
      glowRect(br.x, br.y, br.w, br.h, "hsl(220, 8%, 52%)", 6);
      ctx.strokeStyle = "rgba(255,255,255,0.35)";
      ctx.strokeRect(br.x + 2.5, br.y + 2.5, br.w - 5, br.h - 5);
      ctx.strokeStyle = "rgba(0,0,0,0.4)";
      ctx.beginPath();
      ctx.moveTo(br.x + 4, br.y + br.h / 2); ctx.lineTo(br.x + br.w - 4, br.y + br.h / 2);
      ctx.stroke();
      continue;
    }
    if (br.type === "boom") {
      const throb = 0.75 + 0.25 * Math.sin(pulse * 6);
      glowRect(br.x, br.y, br.w, br.h, `hsla(18, 100%, ${45 + throb * 15}%, 1)`, 16);
      ctx.fillStyle = "#0a0a14";
      ctx.font = "bold 12px monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("✶", br.x + br.w / 2, br.y + br.h / 2 + 1);
      continue;
    }
    const a = br.hp === br.maxHp ? 1 : 0.55;
    const c = `hsla(${br.hue}, 95%, 60%, ${a})`;
    glowRect(br.x, br.y, br.w, br.h, c, 10);
    if (br.maxHp > 1 && br.hp === br.maxHp) {
      ctx.strokeStyle = "rgba(255,255,255,0.7)";
      ctx.strokeRect(br.x + 2.5, br.y + 2.5, br.w - 5, br.h - 5);
    }
  }

  // lasers
  for (const L of lasers) {
    glowRect(L.x - 1.5, L.y - 14, 3, 14, "#7df9ff", 10);
  }

  // power-ups
  for (const p of powerups) {
    const info = POWER_INFO[p.kind];
    ctx.save();
    ctx.shadowColor = `hsl(${info.hue},100%,60%)`;
    ctx.shadowBlur = 14;
    ctx.fillStyle = info.good ? `hsl(${info.hue},100%,60%)` : "#ff2222";
    ctx.beginPath();
    ctx.arc(p.x, p.y, 11, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#0a0a14";
    ctx.font = "bold 11px monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(info.label, p.x, p.y + 1);
    ctx.restore();
  }

  // particles
  for (const p of particles) {
    const t = 1 - p.life / p.max;
    ctx.fillStyle = `hsla(${p.hue}, 95%, 65%, ${t})`;
    ctx.fillRect(p.x, p.y, p.size * t + 1, p.size * t + 1);
  }

  if (state !== STATE.MENU) {
    // paddle
    const pc = shrinkT > 0 ? "#ff2222" : wideT > 0 ? "hsl(130,100%,60%)" : laserT > 0 ? "#7df9ff" : "#00e5ff";
    glowRect(paddle.x - paddle.w / 2, paddle.y, paddle.w, paddle.h, pc, 16);
    if (laserT > 0) {
      glowRect(paddle.x - paddle.w / 2 + 3, paddle.y - 5, 6, 5, "#7df9ff", 8);
      glowRect(paddle.x + paddle.w / 2 - 9, paddle.y - 5, 6, 5, "#7df9ff", 8);
    }

    // balls
    for (const b of balls) {
      ctx.save();
      const bc = fireT > 0 ? "hsl(25,100%,60%)" : slowmoT > 0 ? "hsl(280,100%,80%)" : "#ffffff";
      ctx.shadowColor = bc;
      ctx.shadowBlur = fireT > 0 ? 20 : 14;
      ctx.fillStyle = bc;
      ctx.beginPath();
      ctx.arc(b.x, b.y, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // score popups
    for (const p of popups) {
      const t = 1 - p.life / 0.8;
      ctx.fillStyle = `hsla(${p.hue}, 100%, 70%, ${t})`;
      ctx.font = "bold 13px monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "alphabetic";
      ctx.fillText(p.txt, p.x, p.y);
    }

    // HUD
    ctx.fillStyle = "#9ad7e8";
    ctx.font = "bold 16px monospace";
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    ctx.fillText("SCORE " + score, 14, 28);
    ctx.textAlign = "center";
    ctx.fillText("LVL " + level, W / 2, 28);
    ctx.textAlign = "right";
    ctx.fillText("♥".repeat(Math.max(0, lives)), W - 14, 28);
    if (combo > 1) {
      ctx.textAlign = "center";
      ctx.fillStyle = `hsl(${40 + combo * 10}, 100%, 60%)`;
      ctx.font = "bold 14px monospace";
      ctx.fillText("COMBO ×" + combo, W / 2, 48);
    }
    // active effect timers
    const fx = [];
    if (laserT > 0) fx.push("⚡" + Math.ceil(laserT));
    if (fireT > 0) fx.push("◉" + Math.ceil(fireT));
    if (slowmoT > 0) fx.push("◐" + Math.ceil(slowmoT));
    if (wideT > 0) fx.push("⟷" + Math.ceil(wideT));
    if (shrinkT > 0) fx.push("☠" + Math.ceil(shrinkT));
    if (fx.length) {
      ctx.textAlign = "left";
      ctx.fillStyle = "#9ad7e8";
      ctx.font = "13px monospace";
      ctx.fillText(fx.join("  "), 14, H - 14);
    }
  }

  ctx.textAlign = "center";

  if (state === STATE.MENU) {
    drawTitle();
    ctx.fillStyle = "#9ad7e8";
    ctx.font = "16px monospace";
    pulseText("CLICK / TAP / SPACE TO START", W / 2, H / 2 + 52);
    ctx.fillStyle = "#5a7a8a";
    ctx.font = "13px monospace";
    ctx.fillText("move: mouse · touch · ← → / A D", W / 2, H / 2 + 96);
    ctx.fillText("P pause · M mute", W / 2, H / 2 + 116);
    ctx.fillStyle = "#7a9aaa";
    ctx.fillText("×3 multi  ⟷ wide  ◐ slow  ⚡ laser", W / 2, H / 2 + 152);
    ctx.fillText("◉ fireball  ♥ life  —  avoid ☠", W / 2, H / 2 + 172);
    if (high > 0) {
      ctx.fillStyle = "#ffd54a";
      ctx.font = "bold 15px monospace";
      ctx.fillText("HIGH SCORE " + high, W / 2, H / 2 + 210);
    }
  }

  if (state === STATE.PLAY && balls.some(b => b.stuck)) {
    ctx.fillStyle = "#9ad7e8";
    ctx.font = "14px monospace";
    pulseText("click / tap / space to launch", W / 2, H - 90);
  }

  if (state === STATE.PLAY && paused) {
    veil();
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 28px monospace";
    ctx.fillText("PAUSED", W / 2, H / 2);
    ctx.font = "14px monospace";
    ctx.fillStyle = "#9ad7e8";
    ctx.fillText("press P or click to resume", W / 2, H / 2 + 30);
  }

  if (state === STATE.LEVELUP) {
    veil();
    ctx.fillStyle = "#00ffa6";
    ctx.font = "bold 30px monospace";
    ctx.shadowColor = "#00ffa6";
    ctx.shadowBlur = 20;
    ctx.fillText("LEVEL " + level + " CLEAR!", W / 2, H / 2 - 10);
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#9ad7e8";
    ctx.font = "15px monospace";
    ctx.fillText("+" + (100 * level) + " bonus", W / 2, H / 2 + 26);
  }

  if (state === STATE.OVER) {
    veil();
    ctx.fillStyle = "#ff3b6b";
    ctx.font = "bold 34px monospace";
    ctx.shadowColor = "#ff3b6b";
    ctx.shadowBlur = 22;
    ctx.fillText("GAME OVER", W / 2, H / 2 - 40);
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 18px monospace";
    ctx.fillText("SCORE " + score, W / 2, H / 2 + 4);
    if (score >= high && score > 0) {
      ctx.fillStyle = "#ffd54a";
      ctx.fillText("★ NEW HIGH SCORE ★", W / 2, H / 2 + 32);
    } else {
      ctx.fillStyle = "#9ad7e8";
      ctx.font = "15px monospace";
      ctx.fillText("best " + high, W / 2, H / 2 + 32);
    }
    ctx.fillStyle = "#9ad7e8";
    ctx.font = "15px monospace";
    pulseText("click / tap / space to retry", W / 2, H / 2 + 80);
  }

  // damage flash
  if (flash > 0) {
    ctx.fillStyle = `rgba(255, 40, 80, ${flash * 0.25})`;
    ctx.fillRect(-10, -10, W + 20, H + 20);
  }

  if (muted) {
    ctx.fillStyle = "#5a7a8a";
    ctx.font = "12px monospace";
    ctx.textAlign = "right";
    ctx.fillText("🔇", W - 14, H - 32);
  }

  ctx.restore();
}

function veil() {
  ctx.fillStyle = "rgba(10,10,20,0.72)";
  ctx.fillRect(-10, -10, W + 20, H + 20);
}

let pulse = 0;
function pulseText(txt, x, y) {
  ctx.save();
  ctx.globalAlpha = 0.6 + 0.4 * Math.sin(pulse * 5);
  ctx.fillText(txt, x, y);
  ctx.restore();
}

function drawTitle() {
  ctx.save();
  ctx.textAlign = "center";
  ctx.font = "bold 44px monospace";
  ctx.shadowBlur = 26;
  ctx.shadowColor = "#00e5ff";
  ctx.fillStyle = "#00e5ff";
  ctx.fillText("NEON", W / 2, H / 2 - 70);
  ctx.shadowColor = "#ff3b6b";
  ctx.fillStyle = "#ff3b6b";
  ctx.fillText("BREAKOUT", W / 2, H / 2 - 22);
  ctx.restore();
}

// ---------- Loop ----------
let last = performance.now();
function loop(now) {
  let dt = Math.min((now - last) / 1000, 0.033);
  last = now;
  pulse += dt;
  if (state === STATE.LEVELUP) tickLevelup(dt);
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
